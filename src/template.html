  // 線の よこに そって すすむ 矢印(s0 から s1 まで。off だけ 上に ずらす)
  function uArrow(m, s0, s1, off, sc = 1) {

    return { items };
  }
  const PLAYS = { shiri: playShiri, search: playSearch, miss: playMiss, sort: playSort, cross: playCross, maze: playMaze, kaidan: playKaidan };
  // 絵の ある ひらがなの ことば(クロスワード・しりとり めいろ・ことばの かいだんの ヒント)
  const picWords = () => ((YD.pics || {}).hira || []).filter((x) => YPICS[x.pic]);

  // クロスワード:絵が ヒント。よこ・たての ことばを 4〜6こ 組みあわせる(となりの ますと くっつかない ように)
  function playCross(rng) {
    const N = 8;
    const pool0 = picWords().filter((x) => plainWord(x.w) && x.w.length >= 2 && x.w.length <= 5);
    let best = null;
    for (let attempt = 0; attempt < 80; attempt++) {
      const pool = shuffled(pool0, rng);
      const g = Array.from({ length: N }, () => Array(N).fill(""));
      const placed = [];
      const at = (y, x) => (y >= 0 && x >= 0 && y < N && x < N ? g[y][x] : "");
      const fits = (w, y, x, dir) => {
        const dy = dir === "v" ? 1 : 0, dx = dir === "h" ? 1 : 0;
        if (y < 0 || x < 0 || y + dy * (w.length - 1) >= N || x + dx * (w.length - 1) >= N) return false;
        if (at(y - dy, x - dx) || at(y + dy * w.length, x + dx * w.length)) return false;
        let cross = 0;
        for (let i = 0; i < w.length; i++) {
          const yy = y + dy * i, xx = x + dx * i, c = g[yy][xx];
          if (c) { if (c !== w[i]) return false; cross++; continue; }
          // あたらしい ますの 横(たての ことばなら 左右)に 字が あると、べつの ことばに 見えて しまう
          if (at(yy + dx, xx + dy) || at(yy - dx, xx - dy)) return false;
        }
        return cross > 0 || !placed.length;
      };
      const put = (w, y, x, dir, pic) => {
        for (let i = 0; i < w.length; i++) g[y + (dir === "v" ? i : 0)][x + (dir === "h" ? i : 0)] = w[i];
        placed.push({ w, y, x, dir, pic });
      };
      const first = pool.find((p) => p.w.length >= 4) || pool[0];
      put(first.w, 3, Math.floor(rng() * (N - first.w.length + 1)), "h", first.pic);
      for (const p of pool) {
        if (placed.length >= 6) break;
        if (placed.some((q) => q.w === p.w || q.pic === p.pic)) continue;
        const opts = [];
        for (const q of placed) for (let i = 0; i < p.w.length; i++) for (let j = 0; j < q.w.length; j++) {
          if (p.w[i] !== q.w[j]) continue;
          const dir = q.dir === "h" ? "v" : "h";
          const y = q.dir === "h" ? q.y - i : q.y + j, x = q.dir === "h" ? q.x + j : q.x - i;
          if (fits(p.w, y, x, dir)) opts.push([y, x, dir]);
        }
        if (opts.length) { const [y, x, dir] = opts[Math.floor(rng() * opts.length)]; put(p.w, y, x, dir, p.pic); }
      }
      if (!best || placed.length > best.placed.length) best = { g, placed };
      if (placed.length >= 5) break;
    }
    // つかって いる ところだけ 切りとって、はじまりの ますに 番号(上から、左から)
    const { g, placed } = best;
    let y0 = N, y1 = 0, x0 = N, x1 = 0;
    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) if (g[y][x]) { y0 = Math.min(y0, y); y1 = Math.max(y1, y); x0 = Math.min(x0, x); x1 = Math.max(x1, x); }
    const starts = [...new Set(placed.map((p) => p.y * N + p.x))].sort((a, b) => a - b);
    const words = placed.map((p) => ({ w: p.w, pic: p.pic, dir: p.dir, y: p.y - y0, x: p.x - x0, n: starts.indexOf(p.y * N + p.x) + 1 }))
      .sort((a, b) => a.n - b.n || (a.dir === "h" ? -1 : 1));
    return { rows: y1 - y0 + 1, cols: x1 - x0 + 1, grid: g.slice(y0, y1 + 1).map((r) => r.slice(x0, x1 + 1)), words };
  }

  // しりとり めいろ:4×4の 絵。スタートから しりとりで となりへ すすんで ゴールまで(ちがう 絵には つながらない)
  function playMaze(rng) {
    const R = 4, C = 4;
    const ws = picWords().filter((x) => !x.w.endsWith("ん") && !x.w.endsWith("ー") && x.w.length <= 5);
    const byHead = {};
    for (const p of ws) (byHead[p.w[0]] = byHead[p.w[0]] || []).push(p);
    const nb = (y, x) => [[y - 1, x], [y + 1, x], [y, x - 1], [y, x + 1]].filter(([a, b]) => a >= 0 && b >= 0 && a < R && b < C);
    for (let attempt = 0; attempt < 400; attempt++) {
      // スタート(左上)から ゴール(右下)までの みち(7〜10ます)
      const path = [[0, 0]], seen = new Set(["0,0"]);
      const walk = () => {
        const [y, x] = path[path.length - 1];
        if (y === R - 1 && x === C - 1) return path.length >= 7;
        if (path.length >= 10) return false;
        for (const [a, b] of shuffled(nb(y, x), rng)) {
          if (seen.has(a + "," + b)) continue;
          // みちが 自分の となりに もどって こない(よこの みちに まよわない)
          if (nb(a, b).some(([c, d]) => seen.has(c + "," + d) && !(c === y && d === x))) continue;
          path.push([a, b]); seen.add(a + "," + b);
          if (walk()) return true;
          path.pop(); seen.delete(a + "," + b);
        }
        return false;
      };
      if (!walk()) continue;
      // みちに しりとりの ことばを ならべる
      const chain = [];
      const used = new Set();
      const fill = (i) => {
        if (i === path.length) return true;
        const cand = i === 0 ? shuffled(ws, rng) : shuffled(byHead[lastKana(chain[i - 1].w)] || [], rng);
        for (const p of cand.slice(0, 30)) {
          if (used.has(p.w) || used.has(p.pic)) continue;
          chain.push(p); used.add(p.w); used.add(p.pic);
          if (fill(i + 1)) return true;
          chain.pop(); used.delete(p.w); used.delete(p.pic);
        }
        return false;
      };
      if (!fill(0)) continue;
      const cells = Array.from({ length: R }, () => Array(C).fill(null));
      path.forEach(([y, x], i) => { cells[y][x] = chain[i]; });
      // ほかの ますは、となりの みちの ことばから つながらない 絵に する
      let ok = true;
      for (let y = 0; y < R && ok; y++) for (let x = 0; x < C && ok; x++) {
        if (cells[y][x]) continue;
        const ends = nb(y, x).filter(([a, b]) => cells[a][b] && path.some(([c, d]) => c === a && d === b)).map(([a, b]) => lastKana(cells[a][b].w));
        const p = shuffled(ws, rng).find((q) => !used.has(q.w) && !used.has(q.pic) && !ends.includes(q.w[0]));
        if (!p) ok = false; else { cells[y][x] = p; used.add(p.w); used.add(p.pic); }
      }
      if (!ok) continue;
      return { R, C, cells, path };
    }
    return { R, C, cells: [], path: [] };
  }

  // ことばの かいだん:おなじ 字で はじまる 2字・3字・4字(・5字)の ことばを 書く(絵が ある ことばは 絵を ヒントに)
  function playKaidan(rng) {
    const pics = new Map(picWords().map((p) => [p.w, p.pic]));
    const words = [...new Set([...YPOOL.map((x) => x.w), ...pics.keys()])].filter((w) => plainWord(w));
    const by = {};
    for (const w of words) ((by[w[0]] = by[w[0]] || {})[w.length] = by[w[0]][w.length] || []).push(w);
    const heads = shuffled(Object.keys(by).filter((h) => [2, 3, 4].every((n) => (by[h][n] || []).length)), rng);
    const stairs = heads.slice(0, 2).map((h) => {
      const lens = [2, 3, 4].concat((by[h][5] || []).length ? [5] : []);
      return { head: h, steps: lens.map((n) => {
        const list = by[h][n], withPic = list.filter((w) => pics.has(w));
        const w = (withPic.length ? shuffled(withPic, rng) : shuffled(list, rng))[0];
        return { w, pic: pics.get(w) || null };
      }) };
    });
    return { stairs };
  }

  const PLAY_ORDER = ["shiri", "search", "miss", "sort", "cross", "maze", "kaidan"];

  // 行・テーマ・あそびは "auto"/"mix" なら シードで じゅんばんに かわる(シード1 → あ行、2 → か行 …)
  // 絵(ひらがな・カタカナの なまえつき)を n こ。同じ ことば・同じ 絵は 1かいだけ
  function pickPics(script, n, rng, extra) {
    const seenW = new Set(), seenP = new Set(extra || []);
    return shuffled(((YD.pics || {})[script] || []).filter((x) => YPICS[x.pic]), rng)
      .filter((x) => !seenW.has(x.w) && !seenP.has(x.pic) && seenW.add(x.w) && seenP.add(x.pic)).slice(0, n);
  }
  function buildYoujiSheet({ ykind, yrow, ytheme, yplay, yscript, ycat, yhint, ymatch, ystep, yname, ylimit, ywn, ylstyle, ycorner, ytrace, yn, ythick, yarr, ymid, ysdot, yedot, ytext, ylayout, ysize, ynum, ydir, ypos, ypn, ytate, yapos, yans, seed, no }) {
    const rng = makeRng(seed * 7919 + 4243);
    // ylstyle: なぞる 線の 種類 / ycorner: かどに 点 / ytrace: font(うすい 字)・lines(線で なぞる)・order(書き順)
    const s = { youji: true, ykind, seed, no, lstyle: ylstyle || "dash", corner: !!ycorner, trace: ytrace || "font" };
    // たて書き(右から 左へ、上から 下へ)。字を 書く プリントだけ
    s.tate = ytate === "v" && TATE_KINDS.includes(ykind);
    const step = Math.max(1, Math.min(3, Number(ystep) || 1));
    if (ykind === "hira" || ykind === "kata") {
      // ylimit:「じゅんばんに」の ときに つかう 行の かず(10 なら あ〜わ行だけ)
      const rows = Number(ylimit) > 0 ? YD[ykind].slice(0, Number(ylimit)) : YD[ykind];
      s.row = yrow === "auto" || yrow == null ? rows[(seed - 1) % rows.length] : YD[ykind][Number(yrow) % YD[ykind].length];
    } else if (ykind === "kakikata") {
      // かきかた: 入れた 文(ひらがな・カタカナ・漢字)。1字ずつ / ことばごと / なぞりだけ
      s.text = String(ytext || "").replace(/\r/g, "").slice(0, 300);
      s.layout = ["char", "word", "otehon", "trace", "anaume"].includes(ylayout) ? ylayout : "char";
      s.dir = ydir === "h" ? "h" : "v";
      s.pos = ypos === "r" ? "r" : "l";
      s.size = ["s", "m", "l"].includes(ysize) ? ysize : "m";
      s.lstyle = ylstyle && ylstyle !== "none" ? ylstyle : "fukuro";
      s.mk = { num: ynum !== false, arr: yarr !== false, mid: !!ymid, sdot: ysdot !== false, edot: !!yedot };
    } else if (ykind === "unpitsu") {
      // うんぴつ: はば いっぱいの 線を n 本。矢印・●は えらべる
      s.step = Math.max(1, Math.min(4, Number(ystep) || 1));
      s.n = [3, 4, 5, 6, 8].includes(Number(yn)) ? Number(yn) : 5;
      s.thick = ["thin", "mid", "thick"].includes(ythick) ? ythick : "mid";
      s.lstyle = ylstyle || "grayb";
      Object.assign(s, { arr: yarr !== false, mid: !!ymid, sdot: ysdot !== false, edot: !!yedot });
      const sh = UNP_SHAPES[s.step];
      // 1まいめは やさしい じゅん、ほかは まぜる
      const order = seed === 1 ? sh.map((_, i) => i) : shuffled(sh.map((_, i) => i), rng);
      s.shapes = Array.from({ length: s.n }, (_, i) => order[i % order.length]);
    } else if (ykind === "line") {
      s.step = step;
      const shapes = LINE_SHAPES[step].slice();
      const pics = pickPics("hira", 8, rng);
      s.rows = shuffled(shapes, rng).map((f, i) => ({ d: f(), from: pics[i * 2], to: pics[i * 2 + 1] }));
    } else if (ykind === "match") {
      s.step = step;
      s.mode = ["word", "kata", "same"].includes(ymatch) ? ymatch : "word";
      const n = [0, 3, 4, 5][step];
      s.items = pickPics(s.mode === "kata" ? "kata" : "hira", n, rng);
      // みぎの ならびは ひだりと ちがう じゅんばんに する(1つも おなじ ばしょに ならない ように)
      let order = [];
      for (let k = 0; k < 50; k++) {
        order = shuffled(s.items.map((_, i) => i), rng);
        if (order.every((v, i) => v !== i)) break;
      }
      s.order = order;
    } else if (ykind === "name") {
      s.name = String(yname || "").replace(/[\u3000\s]+/g, " ").trim().slice(0, 10);
    } else if (ykind === "pic") {
      // 絵を ypn こ(3〜8。テーマを しぼって たりない ときは ある だけ)。同じ ことばは 1回だけ
      s.script = yscript === "kata" ? "kata" : "hira";
      s.pn = Math.max(3, Math.min(8, Number(ypn) || 8));
      s.hint = yhint || "first";
      const all = ((YD.pics || {})[s.script] || []).filter((x) => YPICS[x.pic] && (!ycat || ycat === "all" || x.cat === ycat));
      const seen = new Set();
      s.items = shuffled(all, rng).filter((x) => !seen.has(x.w) && seen.add(x.w)).slice(0, s.pn);
    } else if (ykind === "ana") {
      // あなうめ:絵の なまえの 1字を あなに する。あなに なるのは えらんだ 行(あ行〜わ行)の 字だけ
      const rows = YD.hira.slice(0, 10);
      const ri = Number(yrow);
      s.mix = yrow === "mix";
      s.row = s.mix ? { name: "あ〜わ行", chars: rows.flatMap((r) => r.chars) }
        : yrow === "auto" || yrow == null || !(ri >= 0 && ri < rows.length) ? rows[(seed - 1) % rows.length] : rows[ri];
      s.apos = yapos === "any" ? "any" : "head";
      s.ans = ["card", "circle"].includes(yans) ? yans : "write";
      s.pn = Math.max(3, Math.min(8, Number(ypn) || 5));
      const chars = s.row.chars;
      const pool = shuffled(((YD.pics || {}).hira || []).filter((x) => YPICS[x.pic]), rng);
      const hits = (w, any) => [...w].map((c, i) => (i === 0 || any) && chars.includes(c) ? i : -1).filter((i) => i >= 0);
      // 字が かたよらない ように、あなの 字を じゅんばんに まわして えらぶ。
      // さいしょの 字で たりない ときは、ことばの 中の 字で おぎなう(わ行の「ん」など)
      const used = new Set(), items = [];
      const take = (any) => {
        const cand = pool.filter((x) => !used.has(x.w) && hits(x.w, any).length).map((x) => {
          const hs = hits(x.w, any), pos = hs[Math.floor(rng() * hs.length)];
          return { w: x.w, pic: x.pic, pos, ch: [...x.w][pos] };
        });
        const order = shuffled(chars, rng);
        let again = true;
        while (items.length < s.pn && again) {
          again = false;
          for (const c of order) {
            if (items.length >= s.pn) break;
            const k = cand.findIndex((x) => x.ch === c && !used.has(x.w) && !items.some((y) => y.pic === x.pic));
            if (k < 0) continue;
            used.add(cand[k].w);
            items.push(cand[k]);
            again = true;
          }
        }
      };
      take(s.apos === "any");
      if (items.length < s.pn && s.apos === "head") take(true);
      // ○で えらぶ ときの こたえ 3つ(おなじ 行の ほかの 字を 2つ)
      for (const it of items) {
        const r = rows.find((x) => x.chars.includes(it.ch)) || s.row;
        it.opts = shuffled([it.ch, ...shuffled(r.chars.filter((c) => c !== it.ch), rng).slice(0, 2)], rng);
      }
      s.items = items;
      s.cards = shuffled(items.map((it) => it.ch), rng);
    } else if (ykind === "word") {
      const t = YD.themes;
      s.theme = t[ytheme === "auto" || ytheme == null ? (seed - 1) % t.length : Number(ytheme) % t.length];
      // ywn: 1まいの ことばの かず(3〜7)。7より 少ない ときは シードで えらぶ
      const wn = Math.max(3, Math.min(s.theme.words.length, Number(ywn) || s.theme.words.length));
      s.words = wn >= s.theme.words.length ? s.theme.words.slice() : shuffled(s.theme.words, rng).slice(0, wn);
    } else {
      s.play = yplay && yplay !== "mix" ? yplay : PLAY_ORDER[(seed - 1) % PLAY_ORDER.length];
      s.data = PLAYS[s.play](rng);
    }
    return s;
  }

  // ますめ 1つ(十字の 点線つき)。cls: model(お手本)・trace(うすい字)・blank(書く ところ)・ans(答え)
  let YK_PREV = "";   // まえに 画面に 出した ようじの しゅるい(うんぴつに かわった ことを 知る)
  let YT = { trace: "font", lstyle: "dash" };   // いま 作って いる プリントの なぞり方(youjiSheetHtml が きめる)
  const ybox = (ch, cls) => {
    if (ch && YT.trace !== "font" && (cls === "trace" || cls === "model")) {
      const sv = kanaSvg(ch, cls === "model" ? 99 : 0, YT.lstyle === "none" && cls === "trace" ? "dash" : YT.lstyle);
      if (sv) return `<span class="mb ks-box ${cls}">${sv}</span>`;
    }
    return `<span class="mb ${cls || ""}"><i>${ch ? esc(ch) : ""}</i></span>`;
  };
  // 書き順: 1画ずつ ふえる ます(k 画めまで 黒、のこりは 線の 種類)
  const yorder = (ch, k, style) => {
    const sv = kanaSvg(ch, k, style);
    return sv ? `<span class="mb ks-box">${sv}</span>` : ybox(ch, "trace");
  };
  const ywordBoxes = (w, cls) => [...w].map((ch) => ybox(ch, cls)).join("");

  // かきかたの ます 1つ。kind: model(お手本)・order(書き順なぞり)・light(うすい 字)・blank(書く)・bare(わくなし お手本)
  // たて書きに できる ようじの プリント
  const TATE_KINDS = ["hira", "kata", "word", "pic", "play", "name", "ana"];
  function kakiCell(ch, kind, s, B) {
    const fs = `width:${B}mm;height:${B}mm;font-size:${(B * 0.78).toFixed(2)}mm`;
    if (!ch) return `<span class="kk-c${kind === "bare" ? " bare" : ""}" style="${fs}"></span>`;
    let inner = null;
    if (kind === "model" || kind === "bare") inner = kakiSvg(ch, "ink", null);
    else if (kind === "order") inner = kakiSvg(ch, s.lstyle, s.mk);
    else if (kind === "light") inner = kakiSvg(ch, "light", null);
    if (kind === "blank") inner = "";
    if (inner === null) inner = `<i class="${kind === "model" || kind === "bare" ? "m" : "g"}">${esc(ch)}</i>`;
    return `<span class="kk-c ${kind}" style="${fs}">${inner}</span>`;
  }
  // あなうめの 文を 字の ならびに する。[だ] は □、[学校(がっこう)] は □□ に ふりがな
  function anaumeParse(text) {
    const t = text.replace(/[［【]/g, "[").replace(/[］】]/g, "]").replace(/（/g, "(").replace(/）/g, ")");
    return t.split("\n").map((line) => {
      const out = [];
      const re = /\[([^\]\(]*)(?:\(([^)]*)\))?\]/g;
      let last = 0, m;
      const plain = (str) => { for (const ch of str.replace(/\t/g, " ")) out.push({ chars: [ch === "\u3000" ? " " : ch], box: false }); };
      while ((m = re.exec(line))) {
        plain(line.slice(last, m.index));
        const cs = [...m[1].replace(/[\s\u3000]/g, "")];
        if (cs.length) out.push({ chars: cs, box: true, ruby: (m[2] || "").trim() });
        last = re.lastIndex;
      }
      plain(line.slice(last));
      // 行の はじめと おわりの すきまは とる
      while (out.length && !out[0].box && out[0].chars[0] === " ") out.shift();
      while (out.length && !out[out.length - 1].box && out[out.length - 1].chars[0] === " ") out.pop();
      return out;
    }).filter((l) => l.length);
  }
  // あなうめ。たて書き(右から)か よこ書き。□の 字は こたえの ページで 出る
  function anaumeSheets(s, ans, head, foot) {
    const vert = s.dir !== "h";
    const B = { s: 13, m: 17, l: 22 }[s.size], RB = B * 0.42, LG = B * 0.55;
    const AW = 180, AH = 204;
    const perLine = Math.max(4, Math.floor((vert ? AH : AW) / B));
    const lineW = B + RB + LG, maxLines = Math.max(1, Math.floor(((vert ? AW : AH) + LG) / lineW));
    // 1行(れつ)ずつ: 長い 行は おりかえす。□の かたまりは わけない
    const cols = [];
    for (const line of anaumeParse(s.text)) {
      let cur = [], n = 0;
      for (const g of line) {
        const w = g.chars.length;
        if (n + w > perLine && n > 0) { cols.push(cur); cur = []; n = 0; }
        cur.push(g); n += w;
      }
      if (cur.length) cols.push(cur);
    }
    if (!cols.length) cols.push([{ chars: [..."なん"], box: false }, { chars: ["だ"], box: true, ruby: "" }, { chars: [..."ろう"], box: false }]);
    const cell = (ch, box) => {

        a.steps.map((p) => `<div class="kd-row">` +
          `<span class="wline">${[...p.w].map((c, j) => j === 0 ? ybox(c, "plain") : ybox(ans ? c : "", ans ? "ans" : "blank")).join("")}</span>` +
          `<span class="kd-hint">${p.pic ? `<img src="${YPICS[p.pic] || ""}" alt="">` : `<small>${p.w.length}もじ</small>`}</span></div>`).join("") +
        `</div></div>`).join("");
      body = `<h3 class="yj-h"><span class="yj-badge">ことばの かいだん</span></h3>` +
        `<p class="yj-inst">はじめの じから はじまる ことばを かこう。だんだん ながく なるよ。えが ヒント(ほかの ことばでも いいよ)。</p>` +
        `<div class="yj-board kdw">${st}</div>`;
    } else if (s.play === "sort") {
      const items = s.data.items.map((it, i) => `<div class="sort"><span class="yn">${i + 1}</span>` +
        `<span class="hint">${esc(it.cat)}</span>` +
        `<span class="letters">${it.letters.map((c) => `<span class="ball">${esc(c)}</span>`).join("")}</span>` +
        `<span class="yj-arrow">→</span><span class="wline">${[...it.w].map((ch) => ybox(ans ? ch : "", ans ? "ans" : "")).join("")}</span></div>`).join("");
      body = `<h3 class="yj-h"><span class="yj-badge">ならべかえ</span></h3>` +
        `<p class="yj-inst">じの じゅんばんを かえて、ことばを つくろう。ひだりの ことばが ヒントだよ。</p>` +
        `<div class="yj-rows">${items}</div>`;
    }
    if (s.ykind === "unpitsu") {
      // 1本の 高さ(mm)。本数が 多いほど ひくく。A は 線の 上下の はば
      const H = Math.min(42, (204 - 3 * (s.n - 1)) / s.n), A = Math.min(12, H * 0.3);
      const k = { thin: 0.6, mid: 1, thick: 1.7 }[s.thick] || 1;
      const st = s.lstyle === "none" ? "grayb" : s.lstyle;
      const v = LST.line[st] || LST.line.grayb, sw = v[0] * (st === "grayb" ? 1.3 : 1) * k;
      const rows = s.shapes.map((si) => {
        const pts = UNP_SHAPES[s.step][si](H / 2, A), m = uMeasure(pts);
        const d = "M" + pts.map((p) => +p[0].toFixed(2) + "," + +p[1].toFixed(2)).join(" L");
        const off = sw / 2 + 2.2, a = pts[0], z = pts[pts.length - 1];
        let mk = "";
        // はじめの 矢印は さいしょの かどの 手前まで(折れ線)
        const first = pts.length < 60 ? Math.hypot(pts[1][0] - a[0], pts[1][1] - a[1]) - 2 : 99;
        if (s.arr) mk += uArrow(m, 1, Math.max(7, Math.min(15, m.len * 0.12, first)), off);
        if (s.mid) {
          // とちゅうの 矢印は まんなか ちかくで、みぎ むきに すすむ ところ(わの 中や かどを さける)
          const ok = (c) => [-6, -3, 0, 3, 6].every((d) => m.at(c + d).tx > 0.45);
          let best = null;
          for (let c = m.len * 0.3; c <= m.len * 0.7; c += 0.5) if (ok(c) && (best === null || Math.abs(c - m.len / 2) < Math.abs(best - m.len / 2))) best = c;
          if (best !== null) mk += uArrow(m, best - 6, best + 6, off);
        }
        if (s.sdot) mk += `<circle cx="${a[0].toFixed(2)}" cy="${a[1].toFixed(2)}" r="1.3" fill="#111"/>`;
        if (s.edot) mk += `<circle cx="${z[0].toFixed(2)}" cy="${z[1].toFixed(2)}" r="1.3" fill="#111"/>`;
        if (s.corner && pts.length < 60) mk += cornersOf(d).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.1" fill="#111"/>`).join("");
        return `<div class="unp-row"><svg viewBox="0 0 180 ${H.toFixed(2)}" style="height:${H.toFixed(2)}mm" class="unp-svg">` +
          `<path d="${d}" fill="none" stroke="${v[1]}" stroke-width="${sw.toFixed(2)}"${v[2] ? ` stroke-dasharray="${v[2]}"` : ""} stroke-linecap="round" stroke-linejoin="round"/>${mk}</svg></div>`;
      }).join("");
      const how = [s.sdot ? "●から" : "", s.arr || s.mid ? "やじるしの むきに" : "ひだりから みぎへ"].filter(Boolean).join(" ");
      body = `<h3 class="yj-h"><span class="yj-badge">せんを なぞろう</span></h3>` +
        `<p class="yj-inst">${how}、せんを なぞろう。${s.corner ? "・の ところで むきを かえるよ。" : ""}</p>` +
        `<div class="yj-rows unp">${rows}</div>`;
    } else if (s.ykind === "line") {
      const rows = s.rows.map((r, i) => {
        const m = /^M([\d.]+),([\d.]+)/.exec(r.d);
        const img = (pic, x) => pic ? `<image href="${YPICS[pic.pic] || ""}" x="${x}" y="4" width="28" height="28"/>` : "";
        return `<div class="line-row"><span class="yn">${i + 1}</span>` +
          `<svg viewBox="0 0 180 40" class="line-svg">${img(r.from, 2)}${img(r.to, 150)}` +
          `<path d="${r.d}" ${lineAttr("line", s.lstyle === "none" ? "dash" : s.lstyle)}/>` +
          (s.corner ? cornersOf(r.d).map(([x, y]) => `<circle cx="${x}" cy="${y}" r="1.3" fill="#111"/>`).join("") : "") +
          `<circle cx="${m[1]}" cy="${m[2]}" r="2" fill="#111"/>` +
          // おわりにも ●(どこまで なぞるか わかる ように)
          (([ex, ey]) => `<circle cx="${ex.toFixed(1)}" cy="${ey.toFixed(1)}" r="2" fill="#111"/>`)(endOf(r.d)) + `</svg></div>`;
      }).join("");
      body = `<h3 class="yj-h"><span class="yj-badge">せんを なぞろう</span></h3>` +
        `<p class="yj-inst">●から はじめて、ひだりの えから みぎの ●まで、せんを なぞろう。${s.corner ? "・の ところで むきを かえるよ。" : ""}</p>` +
        `<div class="yj-rows lines">${rows}</div>`;
    } else if (s.ykind === "match") {
      // ●と ●の あいだを ひろく とって、線が 長く なるように(交わっても 見分けやすい)
      const n = s.items.length, RH = 44, H = n * RH, W = 200, XL = 54, XR = 146, XI = 156;
      const L = s.items.map((it, i) => {
        const y = i * RH;
        return `<text x="2" y="${y + 9}" class="mt-n">${i + 1}</text>` +
          `<image href="${YPICS[it.pic] || ""}" x="10" y="${y + 4}" width="34" height="34"/>` +
          `<circle cx="${XL}" cy="${y + 21}" r="2.6" fill="#111"/>`;
      }).join("");
      const R = s.order.map((k, j) => {
        const it = s.items[k], y = j * RH;
        let right;
        if (s.mode === "same") right = `<image href="${YPICS[it.pic] || ""}" x="${XI}" y="${y + 4}" width="34" height="34"/>`;
        else {
          const size = Math.min(12, 42 / it.w.length);
          right = `<text x="${XI}" y="${y + 21 + size * 0.36}" font-size="${size.toFixed(1)}" class="mt-w">${esc(it.w)}</text>`;
        }
        return `<circle cx="${XR}" cy="${y + 21}" r="2.6" fill="#111"/>${right}`;
      }).join("");
      const lines = ans ? s.items.map((_, i) => {
        const j = s.order.indexOf(i);
        return `<line x1="${XL}" y1="${i * RH + 21}" x2="${XR}" y2="${j * RH + 21}" stroke="#000" stroke-width="1.3"/>`;
      }).join("") : "";
      const inst = s.mode === "same" ? "ひだりの えと おなじ えを、みぎから さがして ●と ●を せんで むすぼう。"
        : "えと その なまえを、●と ●を せんで むすぼう。";
      body = `<h3 class="yj-h"><span class="yj-badge">せんで むすぼう</span></h3>` +
        `<p class="yj-inst">${inst}</p>` +
        `<div class="yj-rows match"><svg viewBox="0 -2 ${W} ${H + 4}" class="match-svg" style="height:${Math.min((H + 4) * 182 / W, 200).toFixed(1)}mm">${L}${R}${lines}</svg></div>`;
    } else if (s.ykind === "name") {
      const chars = s.name ? [...s.name] : [" ", " ", " ", " ", " "].map(() => "");
      const nCh = chars.filter((c) => c !== " ").length || 5;
      const nGap = chars.filter((c) => c === " ").length;
      // たて書き(A4 よこ)では、見出しの 字を のぞいた たかさ 約106mm に 入る 大きさまで
      const size = Math.min(nCh <= 4 ? 26 : nCh <= 6 ? 22 : 18, s.tate ? 106 / (nCh + nGap * 0.45) : 99);
      const line = (cls) => `<div class="wline nm" style="--mb:${size}mm">` +
        chars.map((c) => c === " " ? `<span class="gap"></span>` : ybox(cls === "blank" ? "" : c, cls === "blank" ? "" : cls)).join("") + `</div>`;
      const rows = [["model", "よく みよう"], ["trace", "なぞろう"], ["trace", "なぞろう"], ["blank", "かいて みよう"], ["blank", "かいて みよう"]]
        .map(([cls, lbl], i) => `<div class="nm-row"><span class="yn">${i + 1}</span><span class="nm-lbl">${lbl}</span>${line(cls)}</div>`).join("");
      body = `<h3 class="yj-h"><span class="yj-badge">じぶんの なまえ</span>を かこう</h3>` +
        `<p class="yj-inst">${s.name ? "おてほんを よく みて、うすい じを なぞってから、じぶんで かいて みよう。" : "（「なまえ」の らんに なまえを いれると、おてほんと なぞりがきが でます）"}</p>` +
        `<div class="yj-rows names">${rows}</div>`;
    }
    const kindCls = s.ykind === "play" ? `yj-${s.play}` : `yj-${s.ykind}`;
    return `<div class="sheet yj ${kindCls}${ans ? " answer" : ""}${s.tate ? " tate" : ""}">` +
      `<div class="sheet-head"><span class="label">${YTITLE[s.ykind]}</span>` +
      `<span class="no">${s.no}</span>` +
      `<span class="fields">` +
      `<span class="field name"><i>なまえ</i><b></b></span></span></div>` +
      body +
      `<div class="sheet-foot"><span class="seed">シード ${s.seed}</span></div></div>`;
  }

  /* ===== 画面 ===== */
  const $ = (id) => document.getElementById(id);
  const state = { grade: 3, gRead: 3, gWrite: 3, gStory: 3, furi: "none", genre: "all", vmode: "write",
                  kind: "both", level: 2, nRead: 8, nWrite: 8, seed: 1,
                  ykind: "hira", yrow: "auto", ytheme: "auto", yplay: "mix", yscript: "hira", ycat: "all", yhint: "first",
                  ymatch: "word", ystep: 1, yname: "", ylimit: 0, ywn: 7, ypn: 8, ytate: "h", ylstyle: "dash", ycorner: false, ytrace: "font", yn: 5, ythick: "mid", yarr: true, ymid: false, ysdot: true, yedot: false, ytext: "", ylayout: "char", ysize: "m", ynum: true, ydir: "v", ypos: "l", yapos: "head", yans: "write", stdir: "h", rn: 3, rtext: "", tk: false, stage: 0, ktopic: "auto", rcase: "lower", rstyle: "std", kfuri: "normal", klearn: "prev" };
  // 学年 0 は ようじ
  const gradeLabel = (g) => (g === 0 ? "ようじ" : BANKS[g - 1].label);

  function setMsg(t) { $("msg").textContent = t || ""; }
  const YANS = ["play", "pic", "match", "ana"];

  // 読みと 書きの 数を そろえる。入らない ときは、さわって いない ほうを へらす
  function settleCounts(changed) {
    const kind = layoutKind(state.kind, state.tk);
    let note = "";
    if (!fits(kind, state.nRead, state.nWrite, state.gStory, state.furi, state.genre)) {
      if (changed === "write") {
        state.nRead = maxFor(kind, "read", state.nWrite, state.gStory, state.furi, state.genre);
        note = `読みを ${state.nRead}問`;
      } else {
        state.nWrite = maxFor(kind, "write", state.nRead, state.gStory, state.furi, state.genre);
        note = `書きを ${state.nWrite}問`;
      }
    }
    if (state.kind !== "long") {
      if (!state.nRead && !state.nWrite) state.nRead = 2;
      state.kind = state.nRead && state.nWrite ? "both" : state.nRead ? "read" : "write";
    }
    return note ? `1枚に 入るように、${note}に しました。` : "";
  }

  function readControls(changedId) {
    state.grade = Number($("f-grade").value);
    if (state.grade === 0) {
      // ようじ:しゅるい・行・テーマ・あそびと シードだけ
      state.ykind = $("f-ykind").value || "hira";
      state.yrow = $("f-yrow").value || "auto";
      state.ytheme = $("f-ytheme").value || "auto";
      state.yplay = $("f-yplay").value || "mix";
      state.yscript = $("f-yscript").value || "hira";
      state.ycat = $("f-ycat").value || "all";
      state.yhint = $("f-yhint").value || "first";
      state.ymatch = $("f-ymatch").value || "word";
      state.ystep = Number($("f-ystep").value) || 1;
      state.yname = $("f-yname").value || "";
      state.ylimit = Number($("f-ylimit").value) || 0;
      state.ywn = Number($("f-ywn").value) || 7;
      state.ypn = Number($("f-ypn").value) || 8;
      state.yapos = $("f-yapos").value === "any" ? "any" : "head";
      state.yans = ["card", "circle"].includes($("f-yans").value) ? $("f-yans").value : "write";
      state.ytate = $("f-ytate").value === "v" ? "v" : "h";
      // たて書きは A4 よこで。よこ書きに もどしたら たてに もどす
      setOrient();
      state.ytrace = $("f-ytrace").value || "font";
      state.ylstyle = $("f-ylstyle").value || "dash";
      state.ycorner = $("f-ycorner").checked;
      state.yn = Number($("f-yn").value) || 5;
      state.ythick = $("f-ythick").value || "mid";
      for (const k of ["yarr", "ymid", "ysdot", "yedot", "ynum"]) state[k] = $("f-" + k).checked;
      state.ytext = $("f-ytext").value || "";
      state.ylayout = $("f-ylayout").value || "char";
      state.ysize = $("f-ysize").value || "m";
      state.ydir = $("f-ydir").value || "v";
      state.ypos = $("f-ypos").value || "l";
      if (state.ykind !== "unpitsu" && state.ystep > 3) state.ystep = 3;
      if (!picCats(state.yscript).includes(state.ycat)) state.ycat = "all";
      if (changedId === "f-ykind") state.yrow = "auto";
      state.seed = Math.max(1, Math.min(999999, Number($("f-seed").value) || 1));
      setMsg("");
      return;
    }
    if (changedId === "f-grade") {
      // 子どもの 学年を かえたら、読み・書き・長文の 学年も そろえる
      state.gRead = state.gWrite = state.gStory = state.grade;
    } else {
      state.gRead = Number($("f-gread").value) || state.grade;
      state.gWrite = Number($("f-gwrite").value) || state.grade;
      state.gStory = Number($("f-gstory").value) || state.grade;
    }
    state.furi = $("f-furi").value || "none";
    state.vmode = ["choice", "none"].includes($("f-vmode").value) ? $("f-vmode").value : "write";
    state.stdir = $("f-stdir").value === "v" ? "v" : "h";
    // 長文の 学年に ない ジャンルなら 「すべて」に もどす
    state.genre = genreFor(state.gStory, changedId === "f-grade" ? state.genre : ($("f-genre").value || state.genre));
    state.level = Number($("f-level").value);
    state.seed = Math.max(1, Math.min(999999, Number($("f-seed").value) || 1));
    let kind = $("f-kind").value;
    if (kind === "renshu") {
      if (hasRenshu(state.grade)) {
        state.kind = "renshu";
        state.rn = Number($("f-rn").value) || 3;
        state.rtext = $("f-rtext").value.trim();
        setMsg(state.rtext && !renshuList(state.grade, state.rtext).own ? "えらんだ 字に 小学校の 漢字が ないので、学年の じゅんで 作りました。" : "");
        return;
      }
      setMsg("漢字練習帳は 小1〜小6で 作れます。");
      kind = "both";
      changedId = "f-kind";
    }
    if (kind === "kimari") {
      if (hasKimari(state.grade)) {
        state.kind = "kimari";
        state.ktopic = changedId === "f-grade" || changedId === "f-kind" ? "auto" : ($("f-ktopic").value || "auto");
        state.rcase = $("f-rcase").value || "lower";
        state.rstyle = $("f-rstyle").value || "std";
        state.kfuri = $("f-kfuri").value || "normal";
        state.klearn = $("f-klearn").value || "prev";
        setMsg("");
        return;
      }
      setMsg(`${gradeLabel(state.grade)} の ことばの きまりは まだ ありません。いまは ${kimariGrades()} で 作れます。`);
      kind = "both";
      changedId = "f-kind";
    }
    // 文章読解(漢字なし) = 長文で 読み・書きが 0問
    const storyOnly = kind === "story";
    if (storyOnly) kind = "long";
    if (kind === "long" && !hasLong(state.gStory)) kind = "both";
    state.tk = $("f-tk").checked;
    const longChanged = (kind === "long") !== (state.kind === "long");
    if (changedId === "f-kind" || changedId === "f-tk" || longChanged ||
        (kind === "long" && ["f-grade", "f-gstory", "f-genre"].includes(changedId))) {
      [state.nRead, state.nWrite] = countsFor(kind);
    } else {
      state.nRead = Number($("f-read").value) || 0;
      state.nWrite = Number($("f-write").value) || 0;
    }
    if (storyOnly && kind === "long") state.nRead = state.nWrite = 0;
    else if (changedId === "f-kind" && kind === "long" && !state.nRead && !state.nWrite) [state.nRead, state.nWrite] = countsFor(kind);
    state.kind = kind;
    const changed = changedId === "f-write" ? "write" : "read";
    const note = settleCounts(changed);
    if (note || $("msg").textContent.indexOf("ことばの きまり") < 0) setMsg(note);
  }

  // 種類を えらんだ ときの 読み・書きの 数(大きい 字なら 少なめ)
  function countsFor(kind) {
    if (state.tk && kind !== "long") return TK_DEFAULTS[kind].slice();
    return defaultCounts(kind, state.gStory, state.furi, state.genre);
  }
  function countOptions(kind, which) {
    kind = layoutKind(kind, state.tk);
    const out = [];
    for (let n = 0; n <= layoutOf(kind, state.gStory, state.furi, state.genre).top; n += 2) {
      const alone = which === "read" ? fits(kind, n, 0, state.gStory, state.furi, state.genre)
                                     : fits(kind, 0, n, state.gStory, state.furi, state.genre);
      if (alone) out.push(`<option value="${n}">${n ? n + "問" : "なし"}</option>`);
    }
    return out.join("");
  }

  function writeControls() {
    document.body.dataset.youji = state.grade === 0 ? "1" : "";
    $("f-grade").value = String(state.grade);
    if (state.grade === 0) {
      const opts = (list) => list.map(([v, name]) => `<option value="${v}">${name}</option>`).join("");
      $("f-ykind").innerHTML = opts(YKINDS);
      $("f-ykind").value = state.ykind;
      const rows = YD[state.ykind === "kata" ? "kata" : "hira"];
      // あなうめは あ行〜わ行と「ぜんぶ まぜる」
      const isAna = state.ykind === "ana";
      if (isAna && !(state.yrow === "auto" || state.yrow === "mix" || Number(state.yrow) < 10)) state.yrow = "auto";
      $("f-yrow").innerHTML = opts([["auto", "じゅんばんに(シードで かわる)"]].concat((isAna ? rows.slice(0, 10) : rows).map((r, i) => [String(i), r.name]),
        isAna ? [["mix", "あ〜わ行 ぜんぶ まぜる"]] : []));
      $("f-yrow").value = state.yrow;
      $("f-ytheme").innerHTML = opts([["auto", "じゅんばんに(シードで かわる)"]].concat(YD.themes.map((t, i) => [String(i), t.name])));
      $("f-ytheme").value = state.ytheme;
      $("f-yplay").innerHTML = opts(YPLAYS);
      $("f-yplay").value = state.yplay;
      $("f-yscript").value = state.yscript;
      $("f-ycat").innerHTML = opts([["all", "すべて"]].concat(picCats(state.yscript).map((c) => [c, c])));
      $("f-ycat").value = state.ycat;
      $("f-yhint").innerHTML = opts(YHINTS);
      $("f-yhint").value = state.yhint;
      for (const id of ["f-yscript", "f-ycat", "f-yhint"]) $(id).closest("label").hidden = state.ykind !== "pic";
      $("f-yrow").closest("label").hidden = !["hira", "kata", "ana"].includes(state.ykind);
      $("f-ymatch").innerHTML = opts(YMATCHES);
      $("f-ymatch").value = state.ymatch;
      $("f-ystep").value = String(state.ystep);
      if ($("f-yname").value !== state.yname) $("f-yname").value = state.yname;
      $("f-ylimit").value = String(state.ylimit);
      $("f-ywn").value = String(state.ywn);
      $("f-ywn").closest("label").hidden = state.ykind !== "word";
      $("f-ypn").value = String(state.ypn);
      $("f-ypn").closest("label").hidden = !["pic", "ana"].includes(state.ykind);
      $("f-yapos").value = state.yapos;
      $("f-yans").value = state.yans;
      for (const id of ["f-yapos", "f-yans"]) $(id).closest("label").hidden = state.ykind !== "ana";
      $("f-ytate").value = state.ytate;
      $("f-ytate").closest("label").hidden = !TATE_KINDS.includes(state.ykind);
      // なぞり方: ひらがな・カタカナは 書き順も、ことば・なまえは うすい 字か 線
      const kanaK = ["hira", "kata"].includes(state.ykind), traceK = kanaK || ["word", "name"].includes(state.ykind);
      if (!kanaK && state.ytrace === "order") state.ytrace = "lines";
      $("f-ytrace").querySelector('option[value="order"]').hidden = !kanaK;
      $("f-ytrace").value = state.ytrace;
      $("f-ytrace").closest("label").hidden = !traceK;
      // うんぴつに かえた ときは 太い うすい 線から、ほかに もどる ときは 点線に
      if (state.ykind !== YK_PREV) {
        if (state.ykind === "unpitsu") state.ylstyle = "grayb";
        else if (state.ykind === "kakikata") state.ylstyle = "fukuro";
        else if (YK_PREV === "unpitsu" || YK_PREV === "kakikata") state.ylstyle = "dash";
        YK_PREV = state.ykind;
      }
      const lsOk = ["line", "unpitsu", "kakikata"].includes(state.ykind) || (traceK && state.ytrace !== "font");
      const allowNone = kanaK && state.ytrace === "order";
      if (!allowNone && state.ylstyle === "none") state.ylstyle = "dash";
      if (state.ykind !== "kakikata" && state.ylstyle === "fukuro") state.ylstyle = "dash";
      $("f-ylstyle").innerHTML = LSTYLES.filter(([v]) => (v !== "none" || allowNone) && (v !== "fukuro" || state.ykind === "kakikata"))
        .map(([v, name]) => `<option value="${v}">${allowNone && v !== "none" ? "のこりの 画: " : ""}${name}</option>`).join("");
      $("f-ylstyle").value = state.ylstyle;
      $("f-ylstyle").closest("label").hidden = !lsOk;
      $("f-ycorner").checked = state.ycorner;
      $("f-ycorner").closest("label").hidden = !["line", "unpitsu"].includes(state.ykind);
      $("f-ystep").querySelector('option[value="4"]').hidden = state.ykind !== "unpitsu";
      $("f-yn").value = String(state.yn);
      $("f-ythick").value = state.ythick;
      for (const k of ["yarr", "ymid", "ysdot", "yedot", "ynum"]) $("f-" + k).checked = state[k];
      for (const id of ["f-yn", "f-ythick"]) $(id).closest("label").hidden = state.ykind !== "unpitsu";
      for (const id of ["f-yarr", "f-ymid", "f-ysdot", "f-yedot"]) $(id).closest("label").hidden = !["unpitsu", "kakikata"].includes(state.ykind);
      if ($("f-ytext").value !== state.ytext) $("f-ytext").value = state.ytext;
      $("f-ylayout").value = state.ylayout;
      $("f-ysize").value = state.ysize;
      for (const id of ["f-ytext", "f-ylayout", "f-ysize"]) $(id).closest("label").hidden = state.ykind !== "kakikata";
      // あなうめ の ときは 書き順の しるしは つかわない。かわりに □の ボタンと むき
      const anK = state.ykind === "kakikata" && state.ylayout === "anaume";
      $("f-ydir").value = state.ydir;
      $("f-ypos").value = state.ypos;
      $("f-ypos").closest("label").hidden = state.ykind !== "kakikata" || anK;
      $("f-ydir").closest("label").hidden = !anK;
      document.querySelector(".an-tools").hidden = !anK;
      $("f-ynum").closest("label").hidden = state.ykind !== "kakikata" || anK;
      if (anK) { for (const id of ["f-yarr", "f-ymid", "f-ysdot", "f-yedot", "f-ylstyle"]) $(id).closest("label").hidden = true; }
      if (state.ykind === "kakikata" && ["otehon", "anaume"].includes(state.ylayout)) $("f-ylstyle").closest("label").hidden = true;
      if (state.ykind === "kakikata" && state.ylayout === "otehon") for (const id of ["f-ynum", "f-yarr", "f-ymid", "f-ysdot", "f-yedot"]) $(id).closest("label").hidden = true;
      $("f-ymatch").closest("label").hidden = state.ykind !== "match";
      $("f-ystep").closest("label").hidden = !["match", "line", "unpitsu"].includes(state.ykind);
      $("f-yname").closest("label").hidden = state.ykind !== "name";
      $("f-ylimit").closest("label").hidden = !(["hira", "kata"].includes(state.ykind) && state.yrow === "auto");
      $("f-ytheme").closest("label").hidden = state.ykind !== "word";
      $("f-yplay").closest("label").hidden = state.ykind !== "play";
      // こたえの ページは ことば あそび・え を みて かこう・せんで むすぼう だけ
      $("f-ans").closest("label").hidden = !(YANS.includes(state.ykind) || (state.ykind === "kakikata" && state.ylayout === "anaume"));
      $("f-seed").value = String(state.seed);
      return;
    }
    $("f-ans").closest("label").hidden = false;
    const isRs = state.kind === "renshu";
    for (const id of ["f-rn", "f-rtext"]) $(id).closest("label").hidden = !isRs;
    if (isRs) {
      $("f-kind").value = "renshu";
      $("f-rn").value = String(state.rn);
      $("f-rtext").value = state.rtext;
      for (const id of ["f-level", "f-read", "f-write", "f-model", "f-anslist", "f-ans", "f-ktopic", "f-rcase", "f-rstyle", "f-kfuri", "f-klearn",
                        "f-gread", "f-gwrite", "f-gstory", "f-genre", "f-furi", "f-vmode", "f-tk", "f-stdir"]) $(id).closest("label").hidden = true;
      $("f-seed").value = String(state.seed);
      return;
    }
    const isKm = state.kind === "kimari";
    for (const id of ["f-level", "f-read", "f-write", "f-model", "f-anslist"]) $(id).closest("label").hidden = isKm;
    $("f-ktopic").closest("label").hidden = !isKm;
    $("f-rcase").closest("label").hidden = true;
    $("f-rstyle").closest("label").hidden = true;
    $("f-kfuri").closest("label").hidden = true;
    $("f-klearn").closest("label").hidden = true;
    if (isKm) {
      $("f-kind").value = "kimari";
      $("f-ktopic").innerHTML = [["auto", "じゅんばんに(シードで かわる)"]].concat(kimariTopics(state.grade).map((t) => [t.id, t.name.replace(/｜([^《]+)《[^》]+》/g, "$1")]))
        .map(([v, name]) => `<option value="${v}">${esc(name)}</option>`).join("");
      $("f-ktopic").value = state.ktopic;
      $("f-rcase").value = state.rcase;
      $("f-rcase").closest("label").hidden = !hasRcase(state.ktopic);
      $("f-rstyle").value = state.rstyle;
      $("f-rstyle").closest("label").hidden = !hasRstyle(state.ktopic);
      const kt = KM.find((t) => t.id === state.ktopic);
      $("f-kfuri").value = state.kfuri;
      $("f-kfuri").closest("label").hidden = !!(kt && kt.nofuri);
      const g = state.grade, prev = g >= 7 ? null : g === 1 ? "まだ ない" : `${BANKS[g - 2].label}まで`;
      $("f-klearn").innerHTML = g >= 7 ? `<option value="this">小6まで</option>`
        : `<option value="prev">${prev}(年度の はじめ)</option><option value="this">${BANKS[g - 1].label}まで(年度の おわり)</option>`;
      if (g >= 7) state.klearn = "this";
      $("f-klearn").value = state.klearn;
      $("f-klearn").closest("label").hidden = !!(kt && kt.nofuri) || !["over", "kana"].includes(state.kfuri);
      for (const id of ["f-gread", "f-gwrite", "f-gstory", "f-genre", "f-furi", "f-vmode", "f-tk", "f-stdir"]) $(id).closest("label").hidden = true;
      $("f-seed").value = String(state.seed);
      return;
    }
    $("f-gread").value = String(state.gRead);
    $("f-gwrite").value = String(state.gWrite);
    $("f-gstory").value = String(state.gStory);
    $("f-furi").value = state.furi;
    $("f-vmode").value = state.vmode;
    const gen = genresOf(state.gStory);
    $("f-genre").innerHTML = gen.map(([k, name]) =>
      `<option value="${k}">${name}(${storiesOf(state.gStory, k).length}話)</option>`).join("");
    $("f-genre").value = state.genre = genreFor(state.gStory, state.genre);
    const isLong = state.kind === "long";
    $("f-genre").closest("label").hidden = !isLong;
    $("f-gstory").closest("label").hidden = !isLong;
    $("f-furi").closest("label").hidden = !isLong;
    $("f-vmode").closest("label").hidden = !isLong || state.gStory < 3;
    $("f-gread").closest("label").hidden = !state.nRead;
    $("f-gwrite").closest("label").hidden = !state.nWrite;
    const storyOnly = isLong && !state.nRead && !state.nWrite;
    $("f-kind").value = storyOnly ? "story" : state.kind;
    for (const id of ["f-read", "f-write", "f-level", "f-model"]) $(id).closest("label").hidden = storyOnly;
    $("f-stdir").value = state.stdir;
    $("f-stdir").closest("label").hidden = !storyOnly;
    $("f-tk").checked = state.tk;
    $("f-tk").closest("label").hidden = isLong;
    $("f-level").value = String(state.level);
    $("f-read").innerHTML = countOptions(state.kind, "read");
    $("f-write").innerHTML = countOptions(state.kind, "write");
    $("f-read").value = String(state.nRead);
    $("f-write").value = String(state.nWrite);
    $("f-seed").value = String(state.seed);
  }

  function pages(n, startSeed) {
    const opt = { model: $("f-model").checked };
    const withAns = $("f-ans").checked;
    if (state.grade === 0) {
      const out = [];
      for (let i = 0; i < n; i++) {
        const s = buildYoujiSheet(Object.assign({}, state, { seed: startSeed + i, no: i + 1 }));
        out.push(youjiSheetHtml(s, {}));
        if (withAns && (YANS.includes(s.ykind) || (s.ykind === "kakikata" && s.layout === "anaume"))) out.push(youjiSheetHtml(s, { answer: true }));
      }
      return out;
    }
    if (state.kind === "renshu") {
      const out = [];
      for (let i = 0; i < n; i++) out.push(renshuSheetHtml(buildRenshuSheet(Object.assign({}, state, { seed: startSeed + i, no: i + 1 }))));
      return out;
    }
    if (state.kind === "kimari") {
      const out = [];
      for (let i = 0; i < n; i++) {
        const s = buildKimariSheet(Object.assign({}, state, { seed: startSeed + i, no: i + 1 }));
        out.push(kimariSheetHtml(s, {}));
        if (withAns) out.push(kimariSheetHtml(s, { answer: true }));
      }
      return out;
    }
    const list = $("f-anslist").checked;
    const out = [];
    for (let i = 0; i < n; i++) {
      const sheet = buildSheet(Object.assign({}, state, { seed: startSeed + i, no: i + 1 }));
      out.push(sheetHtml(sheet, opt));
      if (withAns) out.push(sheetHtml(sheet, Object.assign({ answer: true, list }, opt)));
    }
    return out;
  }

  // 画面の 切りかえ。プリントを 出す ときに 履歴を 1つ ふやすので、ブラウザの「戻る」で メニューに もどれる
  let homeScroll = 0;
  function goSheet() {
    if (document.body.dataset.view !== "sheet") {
      homeScroll = window.scrollY;
      try { history.pushState({ view: "sheet" }, ""); } catch (e) { /* 履歴が 使えなくても 動く */ }
    }
    document.body.dataset.view = "sheet";
  }
  function goHome(fromHistory) {
    if (!fromHistory && history.state && history.state.view === "sheet") {
      try { history.back(); return; } catch (e) { /* そのまま 下へ */ }
    }
    document.body.dataset.view = "home";
    setMsg("");
    renderFavs();
    window.scrollTo(0, homeScroll);
    setTimeout(() => { reSeg(); refreshThumbs(); }, 0);
  }
  window.addEventListener("popstate", (e) => {
    if (e.state && e.state.view === "sheet") {
      if ($("sheets").children.length) { document.body.dataset.view = "sheet"; fitWidth(); }
    } else if (document.body.dataset.view === "sheet") goHome(true);
  });

  function show(n, startSeed) {
    setOrient();
    const html = pages(n, startSeed).join("");
    $("sheets").innerHTML = html;
    goSheet();
    applyOrient($("sheets"));
    fixZoom($("sheets"));
    fillSheets($("sheets"));
    fitWidth();
    favSync();
    updateMini();
    window.scrollTo(0, 0);
  }

  /* ===== 紙の むき(A4 たて・よこ) =====
     よこの ときは、見出しと 下の シードの 間を 1つの 箱(.lbody)に まとめて、
     漢字・ことばの きまり・文章は 2だんに ながし、ようじは 1だんの まま。
     入りきらない ときは 中身を ちぢめる(いちばん 小さくて 0.55倍)。 */
  const PAGE_STYLE = document.createElement("style");
  document.head.appendChild(PAGE_STYLE);
  function setOrient() {
    // A4 よこに するのは、ようじの たて書きの ときだけ
    const l = state.grade === 0 ? state.ytate === "v" && TATE_KINDS.includes(state.ykind)
      : state.kind === "long" && !state.nRead && !state.nWrite && state.stdir === "v";
    document.body.dataset.orient = l ? "l" : "";
    PAGE_STYLE.textContent = l ? "@page { size: A4 landscape; margin: 0; }" : "";
  }
  function applyOrient(root) {
    for (const sheet of root.querySelectorAll(".sheet")) {
      if (sheet.classList.contains("cover")) continue;
      if (!sheet.classList.contains("tate")) continue;
      sheet.classList.add("land");
      const kids = [...sheet.children].filter((k) => !k.classList.contains("sheet-head") && !k.classList.contains("sheet-foot"));
      if (!kids.length) continue;
      const box = document.createElement("div");
      box.className = "lbody " + (sheet.classList.contains("yj") ? "one" : sheet.classList.contains("stv") ? "vt" : "cols");
      kids[0].before(box);
      kids.forEach((k) => box.appendChild(k));
      fitLand(sheet);
    }
  }
  function fitLand(sheet) {
    const box = sheet.querySelector(":scope > .lbody");
    if (!box) return;
    // 文章の たて書きは、1枚に 入る いちばん 大きい 倍率(0.5〜1.6)に する(右から 左へ ながれて、左に はみ出さない)
    if (box.classList.contains("vt")) {
      const over = () => box.scrollWidth > box.clientWidth + 1 || box.scrollHeight > box.clientHeight + 1;
      // まず 1倍で どれだけ あまる・はみ出すかを みて、だいたいの 倍率を よそうしてから、その まわりだけ しらべる(たくさん 作る ときに はやく)
      box.style.zoom = "1";
      const r = Math.max(box.scrollWidth / box.clientWidth, 0.2);
      const g = Math.min(1.6, Math.max(0.5, 1 / Math.sqrt(r)));
      let lo = Math.max(0.5, g * 0.8), hi = Math.min(1.6, g * 1.25);
      box.style.zoom = lo.toFixed(3);
      if (over()) { hi = lo; lo = 0.5; }
      else { box.style.zoom = hi.toFixed(3); if (!over()) { lo = hi; hi = 1.6; } }
      for (let k = 0; k < 6 && hi - lo > 0.008; k++) { const m = (lo + hi) / 2; box.style.zoom = m.toFixed(3); if (over()) hi = m; else lo = m; }
      box.style.zoom = lo.toFixed(3);
      box.dataset.z = lo.toFixed(3);
      return;
    }
    // 4本線の 字が わくから はみ出す ときも ちぢめる(2だんの はばが せまい ため)
    const lines = [...box.querySelectorAll(".km-4l")];
    const over = () => box.scrollWidth > box.clientWidth + 2 || box.scrollHeight > box.clientHeight + 2 ||
      [...box.children].some((k) => k.getBoundingClientRect().right > box.getBoundingClientRect().right + 2) ||
      lines.some((l) => { const t = l.querySelector(".tx"); return t && t.offsetLeft + t.scrollWidth > l.clientWidth + 1; });
    box.style.zoom = "";
    if (!over()) return;
    let lo = 0.55, hi = 1;
    for (let k = 0; k < 9; k++) {
      const m = (lo + hi) / 2;
      box.style.zoom = m.toFixed(3);
      if (over()) hi = m; else lo = m;
    }
    box.style.zoom = lo.toFixed(3);
  }

  // 文章だけの プリント: 1枚に 入る いちばん 大きい 倍率(1〜1.5)を さがして 字を 大きく する
  function fixZoom(root) {
    const pagePx = (297 * 96) / 25.4 + 0.5;
    for (const el of (root || document).querySelectorAll(".st-zoom")) {
      const sheet = el.closest(".sheet");
      if (sheet.classList.contains("land")) continue;
      const tr = sheet.style.transform;
      sheet.style.transform = "";
      const apply = (z) => {
        el.style.width = `${100 / z}%`;
        el.style.transform = `scale(${z})`;
        el.style.marginBottom = "0px";
        el.style.marginBottom = `${el.offsetHeight * (z - 1)}px`;
        return sheet.offsetHeight <= pagePx;
      };
      let lo = 1, hi = 1.5;
      if (apply(hi)) lo = hi;
      else for (let k = 0; k < 8; k++) { const m = (lo + hi) / 2; if (apply(m)) lo = m; else hi = m; }
      apply(lo);
      el.dataset.z = lo.toFixed(3);
      sheet.style.transform = tr;
    }
  }
  // 印刷の 前: スマホ用の ちぢみを 外し、1ページに 入らない プリントは 中身を すこし ちぢめる
  // (フォントの ちがいで ふりがなの 行が 高く なる 機械でも、よぶんな ページや 白い すきまが 出ないように)
  function fitForPrint() {
    const pagePx = ((document.body.dataset.orient === "l" ? 210 : 297) - 0.6) * 96 / 25.4;
    for (const sheet of document.querySelectorAll("#sheets .sheet")) {
      if (sheet.classList.contains("land")) { sheet.style.transform = ""; sheet.style.marginLeft = ""; sheet.style.marginBottom = ""; continue; }
      sheet.style.transform = ""; sheet.style.marginLeft = ""; sheet.style.marginBottom = "";
      const kids = [...sheet.children];
      // 下が あいて 大きく した ぶん(fz)は のこす
      let z = restoreFill(sheet);
      sheet.style.minHeight = "0";
      const cs = getComputedStyle(sheet), pad = parseFloat(cs.paddingTop) + parseFloat(cs.paddingBottom);
      for (let t = 0; t < 4 && sheet.offsetHeight > pagePx; t++) {
        z = Math.max(0.7, z * ((pagePx - pad) / (sheet.offsetHeight - pad)) * 0.995);
        kids.forEach((k) => { k.style.zoom = z.toFixed(3); });
      }
      sheet.style.minHeight = "";
    }
  }
  function afterPrint() {
    for (const s of document.querySelectorAll("#sheets .sheet:not(.land)")) restoreFill(s);
    fitWidth();
  }
  window.addEventListener("beforeprint", fitForPrint);
  window.addEventListener("afterprint", afterPrint);
  function fitWidth() {
    const avail = document.documentElement.clientWidth - 24;
    const paper = document.body.dataset.orient === "l" ? 1123 : 794; // 紙の はばを 96dpi に したときの ピクセル
    const scale = Math.min(1, avail / paper);
    for (const el of document.querySelectorAll("#sheets .sheet")) {
      // 小さい 画面では 左上を 起点に ちぢめて、まん中に よせる
      el.style.transform = scale < 1 ? `scale(${scale})` : "";
      el.style.transformOrigin = scale < 1 ? "top left" : "";
      el.style.marginLeft = scale < 1 ? `${Math.max(0, (avail + 24 - paper * scale) / 2)}px` : "";
      el.style.marginBottom = scale < 1 ? `${18 - (1 - scale) * el.offsetHeight}px` : "";
    }
  }

  function kimariGrades() {
    return BANKS.map((b, i) => (hasKimari(i + 1) ? b.label : "")).filter(Boolean).join("・");
  }
  function longGrades() {
    return Object.keys(READS).map((g) => BANKS[g - 1].label).join("・");
  }

  /* ===== 特別支援学校(知的障害)の 国語の 段階 =====
     学習指導要領の 段階の ねらいに 合わせて、いまある プリントを ならべなおしたもの。プリントに 段階名は 書かない。
     p.grade 0 は ようじの プリント(y: しゅるいの せってい)、1〜 は 漢字・長文(tk: 大きい 字)。 */
  const STAGES = [
    { key: 21, part: "小学部", name: "小学部1段階", short: "1段階",
      note: "いろいろな 筆記用具で 書くことに 親しむ。ことばが ものを 表すことに 気づく。",
      items: [
        { name: "せんを なぞろう", tag: "書写", desc: "●から えまで、てんせんを なぞります。まっすぐ・やま・なみ など。むずかしさで 線の 形が かわります。", p: { grade: 0, y: { ykind: "line" } } },
        { name: "おなじ えを むすぼう", tag: "言葉", desc: "ひだりの えと おなじ えを、●と ●を 線で むすびます(3〜5組)。答えの ページつき。", p: { grade: 0, y: { ykind: "match", ymatch: "same" } } },
        { name: "えの なまえを なぞろう", tag: "言葉", desc: "絵を 見て、なまえを うすい 字で なぞります。", p: { grade: 0, y: { ykind: "pic", yscript: "hira", ycat: "all", yhint: "all" } } }
      ] },
    { key: 22, part: "小学部", name: "小学部2段階", short: "2段階",
      note: "文字などに 関心を もち、読もうと する。文字を 書くことに 興味を もつ。",
      items: [
        { name: "せんを なぞろう", tag: "書写", desc: "なみ・ぎざぎざ・かいだん など、すこし むずかしい 線も なぞります。", p: { grade: 0, y: { ykind: "line" } } },
        { name: "ひらがな なぞり", tag: "書くこと", desc: "あ行から わ行まで。お手本を 見て なぞり、じぶんで 書きます。", p: { grade: 0, y: { ykind: "hira", ylimit: 10 } } },
        { name: "じぶんの なまえを かこう", tag: "書くこと", desc: "名前を 入れると、お手本・なぞり・書く ますが できます。", p: { grade: 0, y: { ykind: "name" } } },
        { name: "え と ことばを むすぼう", tag: "読むこと", desc: "絵と その なまえ(ひらがな)を 線で むすびます。答えの ページつき。", p: { grade: 0, y: { ykind: "match", ymatch: "word" } } },
        { name: "ことば なぞり", tag: "書くこと", desc: "どうぶつ・くだもの など テーマごとの ことばを、大きな ますで なぞって 書きます(1まいに 4こ)。", p: { grade: 0, y: { ykind: "word", ywn: 4 } } }

      if (!n[i]) continue;
      let j = i, acc = "";
      while (j < n.length && acc.length < w.length) acc += n[j++];
      if (acc === w) for (let k = i; k < j; k++) on[k] = true;
    }
    let out = "", open = false;
    ch.forEach((c, i) => {
      if (on[i] && !open) { out += "<mark>"; open = true; }
      if (!on[i] && open) { out += "</mark>"; open = false; }
      out += esc(c);

  function renderNews() {

  // 学年(g)に して、ホームの カード(sel)を おした ときと おなじ ように プリントを ひらく。opts が あれば その せっていで 作り直す
  function openCard(it) {
    if (state.stageMode) { state.stageMode = false; store.set("stageMode", "0"); state.tk = false; }
    state.grade = it.g;
    if (it.g > 0) state.gRead = state.gWrite = state.gStory = it.g;
    writeControls();
    renderKimariCards();
    const card = document.querySelector(`#home-kinds ${it.sel}`);
    if (!card) return;
    card.click();
    if (it.opts) {
      Object.assign(state, it.opts);
      writeControls();
      show(1, state.seed);

  }

  // えらんだ 学年の 色を 画面ぜんたいに つけ、キャラクターの ふきだしを かえる
  // ===== メニューの カードに プリントの 見本を つける(いまの 学年・せっていで。見えた ときに 作る) =====
  function cardSheetHtml(b) {
    // 特別支援の 段階の カード: その 内容の せってい(applyPreset)で 1まいめを 作る。state は あとで もとに もどす
    if (b.classList.contains("tk-card")) return presetSheetHtml(stageOf(state.stage).items[Number(b.dataset.i)]);
    const st = Object.assign({}, state, { seed: 1, no: 1 });
    // 分野べつの カード: その カードの 学年で 作る
    if (b.dataset.g != null) {
      st.grade = Number(b.dataset.g);
      if (st.grade > 0) st.gRead = st.gWrite = st.gStory = st.grade;
    }
    const G = st.grade;
    try {
      if (b.dataset.ykind) {
        st.ykind = b.dataset.ykind; st.ytate = "h";
        if (st.ykind === "unpitsu") st.ylstyle = "grayb";
        else if (st.ykind === "kakikata") { st.ylstyle = "fukuro"; if (!st.ytext.trim()) st.ytext = "なのはな"; st.ylayout = st.ylayout === "anaume" ? "char" : st.ylayout; }
        else if (["fukuro", "grayb"].includes(st.ylstyle)) st.ylstyle = "dash";
        if (st.ykind === "name" && !st.yname) st.yname = "やまだ はな";
        if (st.ykind === "ana") st.ypn = 5;
        return youjiSheetHtml(buildYoujiSheet(st), {});
      }
      if (!(G > 0)) return "";
      if (b.dataset.kind === "kimari") {
        if (!hasKimari(G)) return "";
        st.kind = "kimari"; st.ktopic = b.dataset.topic || "auto";
        return kimariSheetHtml(buildKimariSheet(st), {});
      }
      if (b.dataset.kind === "renshu") {
        if (!hasRenshu(G)) return "";
        st.kind = "renshu"; st.rtext = "";
        return renshuSheetHtml(buildRenshuSheet(st));
      }
      st.kind = b.dataset.kind;
      if (st.kind === "long" && !hasLong(G)) return "";
      st.genre = genreFor(st.gStory, st.genre);
      [st.nRead, st.nWrite] = b.dataset.story ? [0, 0] : countsFor(st.kind);
      return sheetHtml(buildSheet(st), { model: false });
    } catch (e) { return ""; }
  }
  let THUMB_OBS = null;
  function thumbKey() {
    return [state.grade, state.level, state.gRead, state.gWrite, state.gStory, state.furi, state.ytext, state.ylayout, state.ypos, state.tk, state.stage, state.domain].join("|");
  }
  function makeThumb(b) {
    const key = thumbKey();
    if (b.dataset.thumbKey === key) return;
    b.dataset.thumbKey = key;
    const old = b.querySelector(".thumb");
    if (old) old.remove();
    const html = cardSheetHtml(b);
    b.classList.toggle("has-thumb", !!html);
    if (html) b.insertAdjacentHTML("beforeend", `<span class="thumb" aria-hidden="true"><span class="thumb-in">${html}</span></span>`);
  }
  function refreshThumbs() {
    const cards = [...document.querySelectorAll("#home-kinds .kind-card, #tk-kinds .kind-card, #dm-kinds .kind-card")];
    if (!("IntersectionObserver" in window)) { cards.forEach(makeThumb); return; }
    if (!THUMB_OBS) THUMB_OBS = new IntersectionObserver((es) => {
      for (const e of es) if (e.isIntersecting) makeThumb(e.target);
    }, { rootMargin: "200px" });
    for (const c of cards) { THUMB_OBS.unobserve(c); if (c.offsetParent !== null) THUMB_OBS.observe(c); }
  }
  function paintGrade(pop) {
    const g = state.grade;
    const color = state.stageMode ? state.stage - 20 : g;
    for (let i = 0; i <= 7; i++) document.body.classList.toggle(`gc${i}`, i === color);
    document.body.dataset.youji = g === 0 ? "1" : "";
    for (const el of document.querySelectorAll(".hg")) el.setAttribute("aria-pressed", String(
      el.dataset.stage ? Number(el.dataset.stage) === state.stage : Number(el.dataset.grade) === g));
    for (const el of document.querySelectorAll(".level-btn")) el.setAttribute("aria-pressed", String(Number(el.dataset.level) === state.level));
    // 漢字練習帳は 小1〜小6 だけ
    for (const el of document.querySelectorAll('#home-kinds .kk-card[data-kind="renshu"]')) el.style.display = hasRenshu(state.grade) ? "" : "none";
    segSlide($("home-levels"));
    const label = state.stageMode ? stageOf(state.stage).name : gradeLabel(g);
    const dm = state.domain && DOMAINS.find((x) => x.id === state.domain);
    $("home-bubble").innerHTML = dm ? `<b>${dm.label}</b>の<br>プリントを 作ろう！` : `<b>${label}</b>の プリントを<br>作ろう！`;

    $("kinds-hint").textContent = dm ? "カードを おすと、その 学年の プリントが できます。" : "おすと すぐに プリントが できます。数や 学年は あとから かえられます。";
    if (state.stageMode) renderStageKinds();
    else renderKimariCards();
    if (dm) renderDomainKinds();
    for (const c of document.querySelectorAll("#tk-kinds .kind-card, #dm-kinds .kind-card")) delete c.dataset.thumbKey;
    setTimeout(refreshThumbs, 0);
    const c = $("home-chara");

  }

  /* ===== お気に入り(この 端末の ブラウザに ほぞん。プリント画面の「☆ お気に入り」で 入れる・はずす) ===== */
  const FAV_MAX = 30;
  const FAV_Y = Object.keys(state).filter((k) => k[0] === "y");
  function favPick(st) {
    const keys = st.grade === 0 ? ["grade", ...FAV_Y]
      : st.kind === "kimari" ? ["grade", "kind", "ktopic", "rcase", "rstyle", "kfuri", "klearn"]
      : st.kind === "renshu" ? ["grade", "kind", "rn", "rtext"]
      : ["grade", "gRead", "gWrite", "gStory", "furi", "genre", "vmode", "kind", "level", "nRead", "nWrite", "tk", "stdir"];
    const o = {};
    for (const k of keys) o[k] = st[k];
    return o;
  }
  const favKey = (st) => JSON.stringify(favPick(st));
  // プリントの 名前(お気に入り・小さく した パネルに 出す)
  function favName(st) {
    if (st.grade === 0) {
      const c = YJ_CARDS.find((x) => x[0] === st.ykind);
      let n = c ? c[1].replace(/\(.*\)$/, "") : "ようじ";
      const t = (st.ytext || "").trim().split(/\n/)[0].replace(/\[([^\]]*)\]/g, "$1").replace(/\([^)]*\)/g, "");
      if (st.ykind === "kakikata" && t) n += `「${t.length > 8 ? t.slice(0, 8) + "…" : t}」`;
      return n;
    }
    if (st.kind === "kimari") {
      const t = kimariTopics(st.grade).find((x) => x.id === st.ktopic);
      return t ? rubyBase(t.name) : "ことばの きまり";
    }
    if (st.kind === "long") return !st.nRead && !st.nWrite ? "文章読解" : "漢字 ＋ 長文読解";
    return ((KANJI_CARDS.find((c) => c.kind === st.kind) || {}).name || "漢字") + (st.tk ? "(大きい 字)" : "");
  }
  const favStars = (st) => st.grade > 0 && st.kind !== "kimari" && st.kind !== "renshu" && !(st.kind === "long" && !st.nRead && !st.nWrite) ? "★".repeat(st.level) + "☆".repeat(3 - st.level) : "";
  function favList() {
    try {
      const a = JSON.parse(store.get("favs") || "[]");
      return Array.isArray(a) ? a.filter((f) => f && f.st && (f.st.grade === 0 || BANKS[f.st.grade - 1])) : [];
    } catch (e) { return []; }
  }
  const favSave = (a) => store.set("favs", JSON.stringify(a.slice(0, FAV_MAX)));
  function favSync() {
    const b = $("btn-fav");
    const on = favList().some((f) => favKey(f.st) === favKey(state));
    b.classList.toggle("on", on);
    b.setAttribute("aria-pressed", String(on));
    b.querySelector(".fav-star").textContent = on ? "★" : "☆";
    b.title = on ? "お気に入りから はずす" : "この 設定を お気に入りに 入れる(この 端末に ほぞん)";
  }
  function favToggle() {
    readControls();
    const k = favKey(state), a = favList(), i = a.findIndex((f) => favKey(f.st) === k);
    if (i >= 0) a.splice(i, 1);
    else a.unshift({ st: favPick(state), model: $("f-model").checked, ans: $("f-ans").checked, anslist: $("f-anslist").checked });
    favSave(a);
    favSync();
    renderFavs();
    if (i >= 0) { setMsg("お気に入りから はずしました。"); return; }
    // 入れた ときは、すぐ 名前を つけられる(つけなくても いい)
    $("msg").innerHTML = `お気に入りに 入れました(この 端末に ほぞん)。名前を つける なら:<span class="fv-edit"><input type="text" id="fav-name" maxlength="24" placeholder="${esc(favName(state))}" aria-label="お気に入りの 名前"><button type="button" class="secondary" id="fav-name-ok">つける</button></span>`;
    const inp = $("fav-name"), k0 = k;
    const done = () => {
      favRename(k0, inp.value);
      setMsg(inp.value.trim() ? `「${inp.value.trim()}」と いう 名前で お気に入りに 入れました。` : "お気に入りに 入れました(この 端末に ほぞん)。");
    };
    inp.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); done(); } });
    $("fav-name-ok").addEventListener("click", done);
  }
  // お気に入りの 名前を かえる(から なら もとの 名前に もどす)
  function favRename(key, name) {
    const a = favList(), f = a.find((x) => favKey(x.st) === key);
    if (!f) return;
    const n = String(name || "").trim().slice(0, 24);
    if (n) f.name = n; else delete f.name;
    favSave(a);
    renderFavs();
  }
  const favLabel = (f) => f.name || favName(f.st);
  function renderFavs() {
    const box = $("home-favs"), a = favList();
    box.hidden = !a.length;
    if (!a.length) { box.innerHTML = ""; return; }
    box.innerHTML = `<div class="fv-head"><span>★ お気に入り</span><small>この 端末に ほぞん して います。おすと すぐ 作れます。✎で 名前を かえる</small></div><div class="fv-list">${a.map((f, i) => {
      const g = f.st.grade;

    }).join("")}</div>`;
  }
  function goFav(f) {

  /* ===== うごく UI:えらんだ ところ(.on / aria-pressed)の うしろに 色の 板を おいて、まえの 場所から すっと うごかす ===== */
  function segSlide(box) {
    if (!box || !box.offsetParent) return;
    const on = box.querySelector('.on, [aria-pressed="true"]');
    let th = box.querySelector(":scope > .seg-thumb");
    if (!on) { if (th) th.remove(); box._seg = null; return; }
    const fresh = !th;
    if (fresh) { th = document.createElement("span"); th.className = "seg-thumb"; box.prepend(th); }
    const to = { x: on.offsetLeft, y: on.offsetTop, w: on.offsetWidth, h: on.offsetHeight };
    const place = (r) => { th.style.transform = `translate(${r.x}px, ${r.y}px)`; th.style.width = `${r.w}px`; th.style.height = `${r.h}px`; };
    const from = box._seg;
    box._seg = to;
    if (!from || from.h !== to.h || from.y !== to.y) {
      th.classList.remove("anim");
      place(to);
      requestAnimationFrame(() => th.classList.add("anim"));
      return;
    }
    if (fresh) { place(from); th.getBoundingClientRect(); }
    th.classList.add("anim");
    place(to);
  }
  // 画面の 大きさが かわったり、メニューに もどったり したときは、うごかさずに おきなおす

  /* ===== 数の −/＋:となりの 数に うごかして、数字を ぴょこっと ===== */
  function stepCount(b) {
    const sel = $(b.dataset.for);
    if (!sel || sel.disabled) return;
    const opts = [...sel.options].filter((o) => !o.hidden).map((o) => [Number(o.value), o.value]).sort((a, z) => a[0] - z[0]);
    const cur = Number(sel.value), up = Number(b.dataset.step) > 0;
    const next = up ? opts.find((o) => o[0] > cur) : opts.slice().reverse().find((o) => o[0] < cur);
    if (!next) return;
    sel.value = next[1];
    sel.dispatchEvent(new Event("change", { bubbles: true }));
    sel.classList.remove("pop");
    void sel.offsetWidth;
    sel.classList.add("pop");
  }

  /* ===== 下が あいた プリント:中身を すこし 大きく して、ページを うめる(くわしい 設定「下が あいたら 大きく する」で OFF) =====
     文章読解・ことば あそび・せんで むすぼう など、下が 1わり より 多く あいた ページだけ。
     中身(見出しと シードの 間)を zoom で 1.3倍まで。よこに はみ出さず、下に 少し すき間を のこす。 */
  const fitOn = () => $("f-fit").checked;
  function fillSheets(root) {
    if (!fitOn()) return;
    const pagePx = 297 * 96 / 25.4;
    for (const sheet of root.querySelectorAll(".sheet")) {
      sheet.dataset.fz = "";
      if (sheet.matches(".land, .km, .cover, .yj-kakikata, .yj-name")) continue;
      const head = sheet.querySelector(":scope > .sheet-head"), foot = sheet.querySelector(":scope > .sheet-foot");
      if (!head || !foot) continue;
      const kids = [...sheet.children].filter((k) => k !== head && k !== foot);
      if (!kids.length) continue;
      const tr = sheet.style.transform;
      sheet.style.transform = "";
      const leafs = [];
      for (const e of sheet.querySelectorAll("*")) {
        if (head.contains(e) || foot.contains(e)) continue;
        const inSvg = e.parentElement && e.parentElement.closest("svg");
        if (inSvg) continue;
        if (e.tagName === "svg" || e.tagName === "IMG" || !e.children.length || [...e.childNodes].some((n) => n.nodeType === 3 && n.textContent.trim())) leafs.push(e);
      }
      const boxes = [...sheet.querySelectorAll("div, section, p, li")].filter((e) => !foot.contains(e) && !(e.parentElement && e.parentElement.closest("svg")));
      const measure = () => {
        const ft = foot.getBoundingClientRect().top, hb = head.getBoundingClientRect().bottom;
        let mb = hb, mr = 0;
        for (const e of leafs) {
          const r = e.getBoundingClientRect();
          if (!r.height && !r.width) continue;
          mb = Math.max(mb, r.bottom);
          mr = Math.max(mr, r.right);
        }
        return { gap: ft - mb, span: ft - hb, right: mr };
      };
      const m0 = measure();
      if (m0.gap / m0.span < 0.1) { sheet.style.transform = tr; continue; }
      const sr = sheet.getBoundingClientRect(), cs = getComputedStyle(sheet);
      const rightMax = Math.max(m0.right, sr.right - parseFloat(cs.paddingRight)) + 1.5;
      const over0 = boxes.map((e) => Math.max(0, e.scrollWidth - e.clientWidth));
      const set = (z) => kids.forEach((k) => { k.style.zoom = z > 1.001 ? z.toFixed(3) : ""; });
      const ok = () => {
        if (sheet.offsetHeight > pagePx + 1) return false;
        const m = measure();
        if (m.gap < m.span * 0.03 || m.right > rightMax) return false;
        return boxes.every((e, i) => e.scrollWidth - e.clientWidth <= over0[i] + 1);
      };
      const zmax = sheet.querySelector(".st-zoom") ? 1.2 : 1.3;
      let lo = 1, hi = zmax;
      set(hi);
      if (ok()) lo = hi;
      else for (let i = 0; i < 7; i++) { const z = (lo + hi) / 2; set(z); if (ok()) lo = z; else hi = z; }
      set(lo);
      if (lo > 1.001) sheet.dataset.fz = lo.toFixed(3);
      sheet.style.transform = tr;
    }
  }
  // 大きく した ぶん(fz)を、見出しと シード いがいに もどす
  function restoreFill(sheet) {
    const fz = Number(sheet.dataset.fz) || 1;
    for (const k of sheet.children) k.style.zoom = fz > 1 && !k.matches(".sheet-head, .sheet-foot") ? String(fz) : "";
    return fz;
  }

  /* ===== 見本の ポップアップ:カードや お気に入りに カーソルを おくと、その プリントの 1ページめを 大きく 見せる(PC だけ) ===== */
  function withState(fn) {
    const save = JSON.parse(JSON.stringify(state));
    try { return fn(); } catch (e) { return ""; } finally {
      for (const k of Object.keys(state)) if (!(k in save)) delete state[k];
      Object.assign(state, save);
    }
  }
  const presetSheetHtml = (it) => withState(() => { applyPreset(it); state.seed = 1; state.ytate = "h"; return pages(1, 1)[0] || ""; });
  const stateSheetHtml = (st) => withState(() => { Object.assign(state, st); state.seed = 1; state.ytate = "h"; return pages(1, 1)[0] || ""; });
  const HOV = { cache: new Map(), timer: 0, el: null, pop: null };
  const canHover = !!(window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches);
  function hovSource(b) {
    if (b.classList.contains("fv-chip")) {
      const f = favList()[Number(b.dataset.fi)];
      return f ? { key: "fv" + favKey(f.st), title: `${gradeLabel(f.st.grade)} ・ ${favLabel(f)}${f.name ? `(${favName(f.st)})` : ""}`, html: () => stateSheetHtml(f.st) } : null;
    }
    if (b.classList.contains("hf-card")) {
      const it = FOUND[Number(b.dataset.i)];
      return it ? { key: "hf" + it.gname + it.name, title: `${it.gname} ・ ${rubyBase(it.name)}`, html: () => presetSheetHtml(it) } : null;
    }
    const nm = b.querySelector(".name");
    const title = (b.dataset.g != null ? `${b.dataset.g === "0" ? "ようじ" : BANKS[b.dataset.g - 1].label} ・ ` : "") + (nm ? nm.textContent.slice(nm.querySelector(".n") ? nm.querySelector(".n").textContent.length : 0).trim() : "");
    return { key: thumbKey() + "|" + b.parentElement.id + "|" + (b.dataset.i || "") + JSON.stringify(b.dataset), title, html: () => cardSheetHtml(b) };
  }
  function hovHide() {
    clearTimeout(HOV.timer);
    HOV.el = null;
    if (HOV.pop) HOV.pop.classList.remove("show");
  }
  function hovShow(b) {
    if (HOV.el !== b) return;
    const src = hovSource(b);
    if (!src) return;
    if (!HOV.cache.has(src.key)) HOV.cache.set(src.key, src.html());
    const html = HOV.cache.get(src.key);
    if (!html) return;
    if (!HOV.pop) {
      HOV.pop = document.createElement("div");
      HOV.pop.className = "hov-pop";
      document.body.appendChild(HOV.pop);
    }
    HOV.pop.innerHTML = `<div class="hp-cap">${esc(src.title)}<small>見本(1ページめ)。おすと 作れます。問題は シードで かわります</small></div><div class="hp-page"><div class="hp-in">${html}</div></div>`;
    for (const s of HOV.pop.querySelectorAll(".hp-in .sheet ~ .sheet")) s.remove();
    // カードの 右(入らなければ 左)に 出す。上下は 画面に 入るように
    const r = b.getBoundingClientRect(), pw = HOV.pop.offsetWidth, ph = HOV.pop.offsetHeight;
    let x = r.right + 12;
    if (x + pw > window.innerWidth - 8) x = r.left - pw - 12;
    if (x < 8) x = Math.max(8, Math.min(window.innerWidth - pw - 8, r.left));
    const y = Math.max(8, Math.min(window.innerHeight - ph - 8, r.top + r.height / 2 - ph / 2));
    HOV.pop.style.left = `${x}px`;
    HOV.pop.style.top = `${y}px`;
    requestAnimationFrame(() => HOV.pop && HOV.pop.classList.add("show"));
  }

  // html2canvas は zoom を うまく かけないので、うつしの 中だけ「下が あいたら 大きく」の zoom を transform に かえる
  function zoomToTransform(doc) {
    for (const k of doc.querySelectorAll(".sheet[data-fz] > *")) {
      const z = Number(k.style.zoom);
      if (!(z > 1)) continue;
      k.style.zoom = "";
      k.style.width = `${100 / z}%`;
      k.style.transformOrigin = "0 0";
      k.style.transform = `scale(${z})`;
      k.style.marginBottom = `${k.offsetHeight * (z - 1)}px`;
    }
  }
  async function save(format) {
    const n = Number($("b-pages").value) || 1;
    const seed = Number($("b-seed").value) || 1;
    const stateEl = $("b-state");
    // たて書きの 文章は 画像に すると 字が くずれる(html2canvas が たて書きを かけない)ので、印刷から PDF に して もらう
    if (state.grade > 0 && state.kind === "long" && !state.nRead && !state.nWrite && state.stdir === "v") {
      stateEl.textContent = "たて書きの 文章は ここでは PDF・JPG に できません。「画面に 出す」で 作ってから「印刷」を おし、プリンターを「PDF に 保存」に して ください。";
      return;
    }
    try {
      stateEl.textContent = "道具を よみこんでいます…";
      loadLibs();
      show(n, seed);
      $("batch").showModal();
      const sheets = [...document.querySelectorAll("#sheets .sheet")];
      for (const el of sheets) el.style.transform = "";
      const canvases = [];
      for (let i = 0; i < sheets.length; i++) {
        stateEl.textContent = `${i + 1} / ${sheets.length} ページを 画像に しています…`;
        await new Promise((r) => setTimeout(r, 0));
        canvases.push(await window.html2canvas(sheets[i], { scale: 2, backgroundColor: "#fff", onclone: zoomToTransform }));
      }
      const name = `kokugo-${gradeLabel(state.grade)}-${state.grade === 0 ? state.ykind : state.kind}-seed${seed}`;
      if (format === "pdf") {
        const { jsPDF } = window.jspdf;
        const land = document.body.dataset.orient === "l";
        const pdf = new jsPDF({ unit: "mm", format: "a4", orientation: land ? "landscape" : "portrait" });
        canvases.forEach((c, i) => {
          if (i) pdf.addPage();
          pdf.addImage(c.toDataURL("image/jpeg", 0.92), "JPEG", 0, 0, land ? 297 : 210, land ? 210 : 297);
        });
        pdf.save(`${name}.pdf`);
      } else {
        const zip = new window.JSZip();
        canvases.forEach((c, i) => {
          const b64 = c.toDataURL("image/jpeg", 0.92).split(",")[1];
          zip.file(`${String(i + 1).padStart(3, "0")}.jpg`, b64, { base64: true });
        });
        const blob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `${name}.zip`;
        a.click();
        URL.revokeObjectURL(a.href);
      }
      stateEl.textContent = "できました。";
      fitWidth();
    } catch (err) {
      stateEl.textContent = "うまく いきませんでした: " + err.message;
    }
  }

  renderHome();
  bind();

})();

</script>
<!-- PDF・JPG・zip を つくる 道具(html2canvas / jsPDF / JSZip。保存するときだけ よみこむ) -->
<script type="text/x-lib" id="lib-html2canvas">{{VENDOR:html2canvas.min.js}}</script>
<script type="text/x-lib" id="lib-jspdf">{{VENDOR:jspdf.umd.min.js}}</script>
<script type="text/x-lib" id="lib-jszip">{{VENDOR:jszip.min.js}}</script>
</body>
