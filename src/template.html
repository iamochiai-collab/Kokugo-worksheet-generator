<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="app-version" content="第47版(2026-11-26)">
<title>国語プリント</title>
<link rel="icon" type="image/png" sizes="32x32" href="{{ICON:32}}">
<link rel="icon" type="image/png" sizes="64x64" href="{{ICON:64}}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ICON:180}}">
<meta name="theme-color" content="#f37f81">
<style>
:root {
  --ink: #111;
  --rule: #444;
  --light: #999;
  --accent: #2b3a55;
  --answer: #000;  /* プリントは 白黒(答えの 字も 黒) */
  --paper-w: 210mm;
  --paper-h: 297mm;
  --margin: 14mm;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  font-family: "BIZ UDPGothic", "BIZ UDゴシック", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif;
  color: var(--ink);
  font-size: 13pt;
  line-height: 1.7;
  background: #e9e9ec;
}

/* ===== 画面(メニュー・操作パネル)=====
   算数プリントと 同じ 形。学年ごとに 色が あり、えらんだ 学年の 色(--gc)が 画面ぜんたいの 色に なる。
   プリント(.sheet)の 見た目には かかわらない。 */
:root {
  --ui-bg: #eef0f5; --ui-card: #ffffff; --ui-ink: #1f2a40; --ui-sub: #5a6070; --ui-line: #d5d8e2;
  --gc: #3b8a4c; --gc-soft: #e9f4ec;
  --k-both: #e0533f; --k-read: #2f7fd1; --k-write: #2b9a5d; --k-long: #8a54cf;
}
body.gc0 { --gc: #c9457f; --gc-soft: #fbe9f1; }
body[data-youji="1"] .kk-card, body:not([data-youji="1"]) .yj-card { display: none; }
body[data-youji="1"] .level-step { display: none; }
.hg .name.yo { font-size: 19px; line-height: 1.55; }
body.gc1 { --gc: #d4473b; --gc-soft: #fcebea; } body.gc2 { --gc: #d5761a; --gc-soft: #fdf0e3; }
body.gc3 { --gc: #3b8a4c; --gc-soft: #e9f4ec; } body.gc4 { --gc: #1f8580; --gc-soft: #e4f3f2; }
body.gc5 { --gc: #2f67b1; --gc-soft: #e8eff9; } body.gc6 { --gc: #7150a6; --gc-soft: #f0ebf8; }
body.gc7 { --gc: #b0476b; --gc-soft: #f8eaf0; }
.c0 { --c: #c9457f; } .c1 { --c: #d4473b; } .c2 { --c: #d5761a; } .c3 { --c: #3b8a4c; } .c4 { --c: #1f8580; }
.c5 { --c: #2f67b1; } .c6 { --c: #7150a6; } .c7 { --c: #b0476b; }
body { background: var(--ui-bg); }
.chara { background-size: contain; background-repeat: no-repeat; background-position: center bottom; }
.chara-book { background-image: url({{CHARA:book}}); }
.chara-guide { background-image: url({{CHARA:guide}}); }
.chara-cheer { background-image: url({{CHARA:cheer}}); }
.chara-maru { background-image: url({{CHARA:maru}}); }
.chara-idea { background-image: url({{CHARA:idea}}); }
.chara-think { background-image: url({{CHARA:think}}); }
.chara-banzai { background-image: url({{CHARA:banzai}}); }
@keyframes chara-pop { 0% { transform: translateY(0) scale(1); } 40% { transform: translateY(-10px) scale(1.04); } 100% { transform: translateY(0) scale(1); } }
.chara.pop { animation: chara-pop .45s ease; }
@media (prefers-reduced-motion: reduce) { .chara.pop { animation: none; } }

/* タイトル:原稿用紙の ますめに 1字ずつ */
.masu { display: inline-flex; gap: 3px; margin: 0; font-size: inherit; }
.masu span {
  display: inline-flex; align-items: center; justify-content: center; width: 1.35em; height: 1.35em;
  border: 2px solid var(--c); color: var(--c); background: #fff; border-radius: 4px; font-weight: bold; line-height: 1;
}
.masu span:nth-child(odd) { transform: rotate(-3deg); }
.masu span:nth-child(even) { transform: rotate(2deg); }

/* ===== 操作パネル(プリントの 画面) ===== */
.panel {
  background: var(--ui-card); border-bottom: 1px solid var(--ui-line); border-top: 5px solid var(--gc);
  padding: 10px 16px 12px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: flex-end;
  position: sticky; top: 0; z-index: 5; font-size: 14px; color: var(--ui-ink);
}
.panel .title-row { width: 100%; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.panel .title-row .chara { width: 38px; height: 44px; flex: none; }
.panel h1 { font-size: 15px; }
.panel .subtitle { font-size: 12px; color: var(--ui-sub); }
.panel .version { margin-left: auto; font-size: 12px; color: var(--ui-sub); }
body[data-view="home"] .panel { display: none; }
/* 設定の パネルを 小さく(1行に)する。もう一度 おすと もとに もどる */
.panel .btn-mini { flex: none; font-size: 13px; padding: 4px 12px; border-width: 1.5px; }
.panel .mini-sum { display: none; }
.panel.mini { padding-top: 6px; padding-bottom: 6px; align-items: center; }
.panel.mini > label { display: none !important; }
.panel.mini .title-row { width: auto; flex: 1 1 260px; min-width: 0; flex-wrap: nowrap; }
.panel.mini .title-row .chara, .panel.mini .title-row .subtitle, .panel.mini .title-row .version { display: none; }
.panel.mini .title-row h1 { font-size: 12px; flex: none; }
.panel.mini .mini-sum { display: block; flex: 1; min-width: 0; font-size: 13px; font-weight: bold; color: var(--ui-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel.mini .title-row .btn-mini { margin-left: 0; }
.panel:not(.mini) .title-row .btn-mini { margin-left: 4px; }
@media (max-width: 760px) { .panel .btn-mini { display: none; } }
.panel label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--ui-sub); font-weight: bold; }
.panel label[hidden] { display: none; }
/* かきかたの「かく ことば」は 大きく(1れつ ぜんぶ つかう) */
.panel label.kk-text { flex-basis: 100%; font-size: 14px; }
.panel .an-tools { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-weight: normal; }
.panel .an-tools[hidden] { display: none; }
.panel .an-tools button { font-size: 14px; padding: 6px 14px; }
.panel #f-ytext { width: 100%; box-sizing: border-box; min-height: 190px; font-size: 28px; line-height: 1.5; padding: 10px 16px;
  border: 2px solid var(--gc); border-radius: 12px; background: #fff; color: var(--ui-ink);
  font-family: "KleeKana", "BIZ UDPGothic", sans-serif; font-weight: normal; resize: vertical; }
.panel select, .panel input[type=number] {
  font: inherit; font-size: 15px; padding: 5px 8px; border: 1.5px solid var(--ui-line); border-radius: 8px;
  background: #fff; color: var(--ui-ink); min-width: 120px; height: 34px;
}
.panel select:focus, .panel input:focus { outline: 2px solid var(--gc); outline-offset: 1px; border-color: var(--gc); }
.panel input[type=number] { width: 96px; min-width: 0; }
.panel .check { flex-direction: row; align-items: center; gap: 6px; font-size: 14px; color: var(--ui-ink); font-weight: normal; padding-bottom: 6px; }
.panel .check input { accent-color: var(--gc); width: 16px; height: 16px; }
.panel .buttons { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.panel button, .batch-form button {
  font: inherit; font-size: 15px; font-weight: bold; padding: 7px 16px; border-radius: 10px; border: 2px solid var(--gc);
  background: var(--gc); color: #fff; cursor: pointer;
}
.panel button.secondary, .batch-form button.secondary { background: #fff; color: var(--gc); }
.panel button:hover, .batch-form button:hover { filter: brightness(1.08); }
.panel button:focus-visible, .batch-form button:focus-visible, .hg:focus-visible, .level-btn:focus-visible, .kind-card:focus-visible { outline: 3px solid var(--ui-ink); outline-offset: 2px; }
.panel button:disabled { opacity: 0.4; cursor: default; }
.panel .msg { width: 100%; font-size: 13px; min-height: 0; }
.panel .msg:not(:empty) {
  display: flex; align-items: center; gap: 8px; color: #8a2d4a; background: #fdeef3; border: 1px solid #f2c4d3;
  border-radius: 10px; padding: 6px 12px;
}
.panel .msg:not(:empty)::before {
  content: ""; width: 26px; height: 30px; flex: none; background: url({{CHARA:think}}) center / contain no-repeat;
}
body[data-view="home"] .panel .sheet-only { display: none; }
body[data-youji="1"] .kk-only, body:not([data-youji="1"]) .yj-only { display: none !important; }
body[data-view="sheet"] #home { display: none; }
body[data-view="home"] #sheets { display: none; }

/* ===== メニュー(算数プリントと おなじ 形:上の 帯・3つの タブ・わく・右に あたらしく なったこと と キャラ) ===== */
#home { max-width: 1100px; margin: 0 auto; padding: 26px 16px 30px; color: var(--ui-ink); }
.home-top { display: flex; align-items: stretch; gap: 16px; }
.home-band { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 18px; background: #fff; border: 1px solid #dfe3ea; border-radius: 14px; padding: 10px 14px; box-sizing: border-box; min-width: 0; max-width: 100%; }
.home-band .home-hero { margin: 0; }
.home-band .xsite { margin: 0 0 0 auto; }
.home-band .home-search { margin: 0; flex: 1 1 100%; max-width: none; box-sizing: border-box; min-width: 0; }
.hn-btn { display: none; }
.home-tabs { display: flex; gap: 6px; margin-top: 16px; border-bottom: 3px solid var(--tabc); }
.htab { display: flex; align-items: center; gap: 8px; font: inherit; font-weight: bold; font-size: 15px; padding: 7px 16px 6px 10px; border: 2px solid #d8dbe2; border-bottom: none; border-radius: 12px 12px 0 0; background: #f4f5f8; color: #556; cursor: pointer; text-align: left; line-height: 1.25; }
.htab img { width: 34px; height: 34px; object-fit: contain; flex: none; }
.htab small { display: block; font-size: 11px; font-weight: normal; color: #889; }
.htab:hover { background: #fff; }
.htab.on { background: var(--tabc); border-color: var(--tabc); color: #fff; }
.htab.on small { color: rgba(255,255,255,.85); }
.htab.on img { background: #fff; border-radius: 8px; padding: 2px; box-sizing: border-box; }
.htab .tl-short { display: none; }
.home-steps { background: #fff; border: 1.5px solid var(--tabc); border-top: none; border-radius: 0 0 14px 14px; padding: 4px 16px 16px; }
.home-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 28px; }
.home-row .step-a { flex: 1 1 auto; min-width: 0; }
.hg-row { flex: 1 1 100%; }
.hg-cap2 { display: block; font-size: 12px; color: var(--ui-sub); margin: 0 0 5px; }
.hg-in { display: flex; flex-wrap: wrap; gap: 8px; }
body { --tabc: var(--gc); }
body[data-tab="stage"] { --tabc: #b8406a; }
body[data-tab="domain"] { --tabc: #2f67b1; }
body[data-tab="domain"] .home-steps .home-step .n { background: var(--tabc); }
body:not([data-tab="domain"]) .dm-only, body[data-tab="domain"] .no-dm { display: none !important; }
/* 分野べつ */
.hd { font: inherit; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border-radius: 12px; border: 2px solid var(--c); background: #fff; color: var(--c); cursor: pointer; }
.hd .mk { width: 30px; height: 30px; border-radius: 7px; border: 2px solid var(--c); display: inline-flex; align-items: center; justify-content: center; font-size: 17px; background: #fff; color: var(--c); }
.hd small { display: block; font-size: 10.5px; font-weight: normal; opacity: .8; }
.hd[aria-pressed="true"] { background: var(--c); color: #fff; }
.hd:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,42,64,.12); }
.dm-grade { grid-column: 1 / -1; margin: 12px 0 -2px; font-size: 16px; font-weight: bold; color: var(--c, var(--ui-ink)); border-top: 1.5px dashed var(--ui-line); padding-top: 12px; }
.dm-grade:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.kinds .kind-card.dm-card { min-height: 170px; --k: var(--c); }
/* 右の 列:あたらしく なったこと と キャラ */
.home-mascot { flex: none; width: 300px; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.home-news { background: #fffdf3; border: 1.5px solid #e8d89a; border-radius: 12px; padding: 6px 6px 6px 12px; font-size: 13px; }
.home-news:empty { display: none; }
.nw-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 8px; font-weight: bold; color: #8a6a00; padding-right: 6px; }
.nw-head img { width: 20px; height: 20px; vertical-align: -4px; margin-right: 3px; }
.nw-head small { flex-basis: 100%; font-weight: normal; font-size: 11px; color: #a08a40; }
.nw-list { list-style: none; margin: 4px 0 0; padding: 0 6px 0 0; max-height: 168px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.nw-list li { border-top: 1px dashed #eadfb5; }
.nw-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1px 8px; width: 100%; min-height: 33px; padding: 4px 2px; font: inherit; font-size: 13px; text-align: left; color: #333; background: none; border: none; box-sizing: border-box; }
button.nw-row { cursor: pointer; border-radius: 6px; }
button.nw-row:hover { background: #fff3c9; }
.nw-date { color: #8a6a00; font-variant-numeric: tabular-nums; flex: none; font-size: 12px; }
.nw-tag { flex: none; font-size: 11px; font-weight: bold; color: #fff; background: var(--tc, #a08a40); border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
.nw-go { margin-left: auto; flex: none; font-size: 12px; font-weight: bold; color: #2f8a96; white-space: nowrap; }
.nw-text { order: 3; flex-basis: 100%; white-space: normal; line-height: 1.5; }
.hm-chara { margin-top: auto; display: flex; align-items: center; justify-content: flex-end; }
.hm-chara .chara { width: 150px; height: 165px; flex: none; }
.hm-chara .bubble { font-size: 13px; padding: 8px 10px; max-width: 150px; margin: 0 4px 0 0; transform: translateY(-40px); flex: none; box-sizing: border-box; }
.hm-chara .bubble::after { left: auto; right: -9px; bottom: auto; top: 50%; transform: translateY(-50%) rotate(-45deg); }
.kinds-head .chara { width: 40px; height: 46px; align-self: flex-end; margin-right: -4px; }
.kinds-head h2 { color: var(--tabc); }
.home-main { flex: 1; min-width: 0; }
.home-hero h1 { font-size: 30px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; margin: 0; }
.home-hero .version { font-size: 12px; color: var(--ui-sub); font-weight: normal; }
.home-hero p { margin: 10px 0 0; color: var(--ui-sub); font-size: 14px; max-width: 46em; }
.home-step { font-size: 14px; color: var(--ui-ink); font-weight: bold; margin: 20px 0 8px; display: flex; align-items: center; }
.home-step .n {
  display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--gc); color: #fff;
  font-size: 12px; align-items: center; justify-content: center; margin-right: 7px;
}
.grades { display: flex; flex-wrap: wrap; gap: 8px; }
.hg {
  font: inherit; width: 84px; padding: 6px 0 5px; border-radius: 14px; border: 2px solid var(--c); background: #fff;
  color: var(--c); cursor: pointer; display: flex; flex-direction: column; align-items: center; line-height: 1.15;
  transition: transform .12s ease, box-shadow .12s ease;
}
.hg .name { font-size: 25px; font-weight: bold; }
.hg .name small { font-size: 14px; margin-right: 1px; }
.hg .count { font-size: 10.5px; opacity: .8; margin-top: 2px; }
.hg:hover { transform: translateY(-2px); box-shadow: 0 4px 10px rgba(31,42,64,.12); }
.hg[aria-pressed="true"] { background: var(--c); color: #fff; box-shadow: 0 3px 8px rgba(31,42,64,.22); }
.levels { display: inline-flex; border: 2px solid var(--ui-ink); border-radius: 12px; overflow: hidden; background: #fff; }
.level-btn {
  font: inherit; font-size: 15px; padding: 8px 18px; border: 0; border-right: 1.5px solid var(--ui-ink);
  background: #fff; color: var(--ui-ink); cursor: pointer;
}
.level-btn:last-child { border-right: 0; }
.level-btn .st { color: #e2a50b; letter-spacing: 1px; }
.level-btn[aria-pressed="true"] { background: var(--ui-ink); color: #fff; }

/* ===== うごく UI(算数プリントと おなじ) ===== */
/* えらんだ 色が すっと 横に うごく(タブ・★) */
.home-tabs, .levels { position: relative; }
.seg-thumb { position: absolute; left: 0; top: 0; z-index: 0; pointer-events: none; }
.seg-thumb.anim { transition: transform .42s cubic-bezier(.34,1.45,.5,1), width .42s cubic-bezier(.34,1.45,.5,1), background-color .3s; }
.levels .seg-thumb { background: var(--ui-ink); }
.levels .level-btn { position: relative; z-index: 1; background: transparent; transition: color .25s, transform .22s cubic-bezier(.34,1.8,.5,1); }
.levels .level-btn[aria-pressed="true"] { background: transparent; }
.home-tabs .seg-thumb { background: var(--tabc); border-radius: 12px 12px 0 0; }
.home-tabs .htab { position: relative; z-index: 1; background: rgba(244,245,248,.55); transition: color .25s, border-color .25s, transform .22s cubic-bezier(.34,1.8,.5,1); }
.home-tabs .htab.on { background: transparent; }
/* 問題数の −/＋ */
.stepper { display: inline-flex; align-items: center; gap: 4px; }
.panel .st-btn { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--gc); background: #fff; color: var(--gc); font-size: 18px; font-weight: bold; line-height: 1; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.panel .st-btn:hover { background: var(--gc); color: #fff; filter: none; }
.panel .stepper select { min-width: 84px; }
.stepper select.pop { animation: st-pop .35s cubic-bezier(.34,1.6,.5,1); }
@keyframes st-pop { 0% { transform: scale(.82); } 100% { transform: scale(1); } }
/* おすと ぷにっと へこんで はねる */
.hg, .htab, .hd, .hds, .nw-row, .fv-chip, .hn-btn, .st-btn, .xsite-a, .panel .buttons button, .hs-clear, .btn-mini { transition: transform .22s cubic-bezier(.34,1.8,.5,1), box-shadow .12s ease; }
.hg:active, .hd:active, .hds:active, .nw-row:active, .fv-chip:active, .hn-btn:active, .panel .st-btn:active, .xsite-a:active, .panel .buttons button:active, .hs-clear:active, .btn-mini:active { transform: scale(.9); transition-duration: .06s; }
.level-btn:active, .htab:active { transform: scale(.95); transition-duration: .06s; }
.kind-card { transition: transform .22s cubic-bezier(.34,1.8,.5,1), box-shadow .12s ease; }
.kind-card:active { transform: scale(.97); transition-duration: .06s; }
@media (prefers-reduced-motion: reduce) {
  .seg-thumb.anim, .stepper select.pop { transition: none; animation: none; }
  .hg, .level-btn, .htab, .hd, .hds, .nw-row, .fv-chip, .hn-btn, .st-btn, .xsite-a, .panel .buttons button, .hs-clear, .btn-mini, .kind-card { transition: none; transform: none !important; }
}
@media print { .seg-thumb, .st-btn, .home-favs, .fav-btn, .hov-pop { display: none !important; } }

/* ===== お気に入り(この 端末に ほぞん) ===== */
.home-favs { margin-top: 12px; background: #fff; border: 1.5px solid #f0c94a; border-radius: 12px; padding: 8px 12px 10px; }
.home-favs[hidden] { display: none; }
.fv-head { display: flex; align-items: baseline; flex-wrap: wrap; gap: 0 8px; font-weight: bold; color: #a07800; font-size: 13px; }
.fv-head small { font-weight: normal; color: #a99a6a; font-size: 11px; }
.fv-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; max-height: 92px; overflow-y: auto; }
.fv-chip { position: relative; display: inline-flex; align-items: center; gap: 6px; max-width: 100%; font: inherit; font-size: 13px; padding: 5px 28px 5px 6px; border-radius: 999px; border: 1.5px solid #ecd98f; background: #fffbea; color: #333; cursor: pointer; text-align: left; }
.fv-chip:hover { background: #fff3c4; }
.fv-chip .nw-tag { font-size: 11px; }
.fv-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.fv-kind { color: #777; font-size: 11px; white-space: nowrap; }
.fv-x { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #a99a6a; font-size: 13px; line-height: 1; }
.fv-x:hover, .fv-ed:hover { background: #f3e2a6; color: #6a5000; }
.fv-chip { padding-right: 50px; }
.fv-ed { position: absolute; right: 25px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; color: #a99a6a; font-size: 12px; line-height: 1; }
.fv-edit { display: inline-flex; align-items: center; gap: 4px; }
.fv-edit input { font: inherit; font-size: 13px; padding: 4px 10px; border: 1.5px solid #d9a400; border-radius: 999px; width: 13em; max-width: 60vw; background: #fff; }
.fv-edit button { font: inherit; font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1.5px solid #d9a400; background: #fff6cf; color: #6a5000; cursor: pointer; flex: none; }
.panel .msg .fv-edit { margin-left: 4px; }

/* ===== プリント ===== */
#sheets { padding: 18px 0 60px; }
.sheet {
  width: var(--paper-w); min-height: var(--paper-h); margin: 0 auto 18px;
  background: #fff; padding: var(--margin); position: relative;
  box-shadow: 0 2px 12px rgba(0,0,0,0.18);
  display: flex; flex-direction: column;
}
.sheet-head { display: flex; align-items: flex-end; gap: 12px; border-bottom: 2.5px double var(--rule); padding-bottom: 6px; }
.sheet-head .label { font-size: 15pt; font-weight: bold; letter-spacing: 0.04em; }
.sheet-head .no {
  margin-left: 2px; font-size: 11pt; min-width: 2.4em; height: 2.4em; line-height: 2.4em;
  text-align: center; border: 1.5px solid var(--rule); border-radius: 50%;
}
.sheet-head .fields { margin-left: auto; display: flex; gap: 10px; font-size: 10pt; }
.sheet-head .field { display: flex; align-items: center; gap: 4px; }
.sheet-head .field i { font-style: normal; color: #333; }
.sheet-head .field b { display: block; border: 1.2px solid var(--rule); border-radius: 2px; height: 9mm; width: 30mm; }
.sheet-head .field.name b { width: 44mm; }

.q-group { margin-top: calc(9mm + var(--row-extra, 0mm)); }
.q-group > h3 {
  font-size: 12.5pt; margin: 0 0 2mm; display: flex; align-items: center; gap: 7px;
}
.q-group > h3 em {
  font-style: normal; background: var(--ink); color: #fff; font-size: 11pt;
  width: 1.75em; height: 1.75em; line-height: 1.75em; text-align: center; border-radius: 4px;
}
.q-group > .instruction { font-size: 10pt; color: #222; margin: 0 0 4mm; }
.items { display: grid; grid-template-columns: 1fr 1fr; row-gap: calc(6mm + var(--row-extra, 0mm)); column-gap: 7mm; }
.item { display: flex; align-items: baseline; gap: 3px; font-size: 11pt; line-height: 2.3; }
.item > .n { flex: 0 0 auto; }
.item > .n { font-size: 10pt; color: #333; min-width: 2.2em; }
.item > .body { flex: 1; }
.target { font-weight: bold; font-size: 1.04em; text-decoration: underline; text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.paren { display: inline-block; text-align: center; white-space: nowrap; margin-left: 2px; }
.paren u { text-decoration: none; display: inline-block; width: 18mm; white-space: nowrap; border-bottom: 1px solid #bbb; }
/* 読みの （　）は 行の のこりの はば いっぱいに のばす(書きこむ 場所を 広く) */
.item.r > .body { display: flex; align-items: baseline; min-width: 0; }
.item.r .s { flex: 0 1 auto; min-width: 0; }
.item.r .paren { flex: 1 0 auto; display: flex; align-items: baseline; }
.item.r .paren u { flex: 1; width: auto; min-width: 18mm; text-align: center; }

/* 書き取りのます */
.wbox { display: inline-flex; flex-direction: column; align-items: center; vertical-align: bottom; margin: 0 2px; }
.wbox .ruby { font-size: 10pt; font-weight: bold; line-height: 1.25; color: var(--ink); letter-spacing: 0.04em; }
.wbox .cells { display: flex; gap: 1.5px; }
.wbox .cell { width: 16mm; height: 14mm; border: 1.6px solid var(--rule); border-radius: 2px; display: block; }
.wbox.mid .cell { width: 13.5mm; height: 12.5mm; }
.wbox.small .cell { width: 11.5mm; height: 11.5mm; }
.sheet:not(.long) .wbox .cell .ans { font-size: 17pt; }

/* 答え */
.ans { color: var(--answer); }
.item .ans { font-weight: bold; }
.wbox .cell .ans {
  display: flex; align-items: center; justify-content: center; width: 100%; height: 100%;
  font-size: 13pt; font-weight: bold; color: var(--answer);
}
.sheet.answer .sheet-head .label::after { content: "（答え）"; font-size: 11pt; margin-left: 6px; }
.model { color: #bbb; }

/* ふつうの プリント(長文 いがい):レイアウトは そのまま、ねらいの 字(読みの 漢字・書きの 読みがな)だけ 大きく */
.sheet:not(.long) .item .target { font-size: 1.2em; text-underline-offset: 5px; }
.sheet:not(.long) .wbox .ruby { font-size: 13pt; }

/* ふりがな */
ruby rt { font-size: 0.5em; font-weight: normal; letter-spacing: 0; line-height: 1; }
.sheet.sheet.long.furi .reading-box { line-height: 1.9; }

.sheet.long.g1 .q-read .q, .sheet.long.g2 .q-read .q { font-size: 11pt; line-height: 1.6; }
.sheet.long.g1 .q-read .choices, .sheet.long.g2 .q-read .choices { font-size: 10.5pt; line-height: 1.75; gap: 1mm 6mm; }
.sheet.long.g1 .q-read .mark, .sheet.long.g2 .q-read .mark { font-size: 9pt; }
.sheet.long.g3 .reading-box { font-size: 10.5pt; line-height: 1.8; padding: 3mm 4mm; }
.sheet.long.g4 .reading-box { font-size: 9.5pt; line-height: 1.65; padding: 2.6mm 3.6mm; }
.sheet.long.g3 .q-read .q, .sheet.long.g4 .q-read .q { font-size: 10pt; line-height: 1.5; }
.sheet.long.g3 .q-read .choices, .sheet.long.g4 .q-read .choices { font-size: 9.5pt; line-height: 1.55; }
/* 中学は 本文が 長い(〜980字)ので すこし 小さく */
.sheet.long.g7 .reading-box { font-size: 8pt; line-height: 1.5; padding: 2.2mm 3mm; }
.sheet.long.g7 .q-read { gap: 0.6mm; }
.sheet.long.g7 .q-read .q { font-size: 9pt; line-height: 1.4; }
.sheet.long.g7 .q-read .choices { font-size: 8pt; line-height: 1.45; }
/* 長文読解(1枚に 4つの 大問が 入るので 全体を つめる) */
.sheet.long { padding: 8mm 11mm; }
.sheet.long .q-group { margin-top: calc(3.4mm + var(--row-extra, 0mm)); }
.sheet.long .q-group > h3 { font-size: 11pt; margin-bottom: 1mm; }
.sheet.long .q-group > h3 em { font-size: 9.5pt; }
.sheet.long .instruction { font-size: 8.5pt; margin-bottom: 2mm; }
.sheet.long .item { font-size: 9.5pt; line-height: 1.45; }
.sheet.long .items { row-gap: calc(1.5mm + var(--row-extra, 0mm)); column-gap: 6mm; }
.sheet.long .wbox .cell { width: 17mm; height: 13.5mm; }
.sheet.long .wbox.small .cell { width: 12.5mm; height: 11mm; }
.sheet.long .wbox .ruby { font-size: 10pt; line-height: 1.1; }
.sheet.long .wbox .cell .ans { font-size: 15pt; }
.reading-box {
  border: 1.2px solid var(--rule); background: #fcfcfc; border-radius: 3px;
  padding: 2.2mm 3.2mm; font-size: 8.5pt; line-height: 1.5; text-align: justify;
}
.q-read { margin-top: 1.8mm; display: flex; flex-direction: column; gap: 0.8mm; }
.q-read .q { font-size: 9.5pt; line-height: 1.45; display: flex; gap: 4px; align-items: baseline; }
.q-read .q .n { min-width: 2.3em; font-size: 9pt; color: #333; }
.q-read .q .paren { margin-left: auto; min-width: 16mm; }
.q-read .choices { display: flex; flex-wrap: wrap; gap: 0.6mm 4mm; padding-left: 2.4em; font-size: 8.5pt; line-height: 1.5; }
.q-read .choice { display: flex; gap: 3px; align-items: baseline; }
.q-read .mark {
  display: inline-block; background: var(--ink); color: #fff; font-size: 8pt; font-weight: bold;
  width: 1.7em; height: 1.7em; line-height: 1.7em; text-align: center; border-radius: 50%; flex: 0 0 auto;
}
.vocab { display: grid; grid-template-columns: 1fr; gap: 1.2mm; margin-top: 1mm; }
.vocab .v { display: flex; align-items: flex-end; gap: 6px; font-size: 10pt; }
.vocab .v .n { min-width: 2.3em; font-size: 9pt; color: #333; }
.vocab .v .word { min-width: 6em; font-weight: bold; }
.vocab .v .line { flex: 1; border-bottom: 1.2px solid var(--rule); height: 5mm; }
.vocab .v .line .ans.vm { font-size: 8.5pt; }
.q-read.vq-list .q .word { font-weight: bold; margin-right: 0.3em; }

.ans-list { margin-top: 8mm; }
.ans-list h3 { font-size: 12pt; margin: 0 0 3mm; }
.ans-list ol { margin: 0; padding-left: 1.6em; columns: 2; column-gap: 10mm; font-size: 11pt; }

.st-zoom { transform-origin: top left; }
.st-zoom .q-read .q > span:not(.n):not(.paren) { flex: 1 1 0; min-width: 0; }
.st-zoom .q-read .q .paren { flex: none; }
.sheet-foot { margin-top: auto; padding-top: 4mm; font-size: 8pt; color: var(--light); display: flex; }
.sheet-foot .seed { margin-left: auto; }
/* 漢字練習帳 */
.sheet.rs .rs-h { display: flex; align-items: baseline; flex-wrap: wrap; gap: 2mm 3mm; font-size: 10.5pt; margin: 3mm 0 2mm; font-weight: normal; }
.sheet.rs .rs-badge { background: #111; color: #fff; border-radius: 1.5mm; padding: 0.6mm 2.4mm; font-weight: bold; }
.sheet.rs .rs-range { font-size: 9.5pt; }
.sheet.rs .rs-how { font-size: 9pt; color: #333; margin-left: auto; }
.sheet.rs .rs-list { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 3mm; }
.sheet.rs .rs-item { border: 1.2px solid #444; border-radius: 2mm; padding: 2mm; display: flex; flex-direction: column; gap: 2mm; }
.sheet.rs .rs-top { display: flex; gap: 3mm; align-items: stretch; }
.sheet.rs .rs-big { flex: none; width: var(--rt); height: var(--rt); border: 1.4px solid #222; position: relative; background:
  linear-gradient(to right, transparent calc(50% - 0.3px), #bbb calc(50% - 0.3px), #bbb calc(50% + 0.3px), transparent calc(50% + 0.3px)),
  linear-gradient(to bottom, transparent calc(50% - 0.3px), #bbb calc(50% - 0.3px), #bbb calc(50% + 0.3px), transparent calc(50% + 0.3px)); }
.sheet.rs .rs-big .ks, .sheet.rs .rs-m .ks, .sheet.rs .rs-st .ks { position: absolute; inset: 0; width: 100%; height: 100%; }
.sheet.rs .rs-info { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: space-between; gap: 0.8mm; font-size: 9.5pt; line-height: 1.35; }
.sheet.rs.c .rs-info { font-size: 8.5pt; line-height: 1.25; gap: 0.4mm; }
.sheet.rs.c .rs-item { padding: 1.5mm; gap: 1.5mm; }
.sheet.rs .rs-row { display: flex; align-items: baseline; gap: 2mm; }
.sheet.rs .rs-row b, .sheet.rs .rs-order b { flex: none; display: inline-block; min-width: 2.2em; font-size: 8pt; border: 1px solid #555; border-radius: 1mm; padding: 0 1mm; text-align: center; font-weight: bold; }
.sheet.rs .rs-row .rs-wl { margin-left: 3mm; }
.sheet.rs .rs-row .ok { font-size: 0.82em; color: #555; }
.sheet.rs .rs-ws { display: flex; flex-wrap: wrap; gap: 0 3mm; }
.sheet.rs .rs-w small { font-size: 0.78em; color: #444; }
.sheet.rs .rs-order { display: flex; align-items: center; gap: 2mm; }
.sheet.rs .rs-sts { display: flex; flex-wrap: wrap; gap: 0.8mm; }
.sheet.rs .rs-st { position: relative; border: 0.8px solid #888; flex: none; }
.sheet.rs .rs-masu { display: flex; justify-content: space-between; }
.sheet.rs .rs-m { position: relative; width: var(--rm); height: var(--rm); border: 1px solid #333; flex: none; background:
  linear-gradient(to right, transparent calc(50% - 0.3px), #c8c8c8 calc(50% - 0.3px), #c8c8c8 calc(50% + 0.3px), transparent calc(50% + 0.3px)),
  linear-gradient(to bottom, transparent calc(50% - 0.3px), #c8c8c8 calc(50% - 0.3px), #c8c8c8 calc(50% + 0.3px), transparent calc(50% + 0.3px)); }
.sheet.rs .rs-m + .rs-m { margin-left: -1px; }

/* ===== ようじの プリント(.sheet.yj)=====
   なぞり書きの 字は 教科書体に ちかい Klee One(かなだけ)。ますは 十字の 点線つき */
@font-face { font-family: "KleeKana"; font-weight: 400; src: url({{FONT:klee-kana.woff2}}) format("woff2"); }
.sheet.yj { font-family: "KleeKana", "UD デジタル 教科書体 NK-R", "UD Digi Kyokasho NK-R", "YuKyokasho", "BIZ UDPGothic", sans-serif; }
.sheet.yj .sheet-head .label { font-size: 17pt; }
.sheet.yj .sheet-head .field i { font-size: 11pt; }
.sheet.yj.answer .sheet-head .label::after { content: "（こたえ）"; }
.yj-h { font-size: 15pt; margin: 6mm 0 1mm; display: flex; align-items: center; gap: 2mm; font-weight: normal; }
.yj-badge { background: var(--ink); color: #fff; border-radius: 3mm; padding: 0.5mm 3.5mm 1mm; font-weight: bold; }
.yj-inst { font-size: 11pt; margin: 0 0 2mm; color: #333; }
.yj-rows { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 3mm; }
.yj .mb {
  position: relative; display: inline-flex; align-items: center; justify-content: center; flex: none;
  width: 24mm; height: 24mm; border: 1.4px solid #444; font-size: 19mm; line-height: 1; background: #fff;
}
.yj .mb + .mb { margin-left: -1.4px; }
.yj .mb::before, .yj .mb::after { content: ""; position: absolute; border: 0 dashed #bdbdbd; }
.yj .mb::before { left: 50%; top: 0; bottom: 0; border-left-width: 1px; }
.yj .mb::after { top: 50%; left: 0; right: 0; border-top-width: 1px; }
.yj .mb > i { position: relative; z-index: 1; font-style: normal; transform: translateY(-0.04em); }
.yj .mb.model { background: #fff; color: #111; border-width: 2.4px; }
.yj .mb.trace { color: #c4c4c4; }
.yj .mb.plain { color: #111; }
.yj .mb.blank { border-width: 2.4px; border-color: #111; }
.yj .mb.ans { color: #000; font-weight: bold; }
.yj .mb.ks-box .ks { position: absolute; inset: 3%; width: 94%; height: 94%; z-index: 1; }
.yj .masu-line.order .mb { width: var(--mbo); height: var(--mbo); }
.yj .wline { display: inline-flex; }
.yj .wline .mb { width: 15mm; height: 15mm; font-size: 11.5mm; }
.yj .wline.small .mb { width: 13mm; height: 13mm; font-size: 10mm; }
.yj-row { display: flex; align-items: center; gap: 6mm; }
.masu-line { display: flex; align-items: flex-start; }
.yj-word { display: flex; flex-direction: column; gap: 1mm; }
.yj-word .lbl { font-size: 9pt; color: #666; }
.yn {
  flex: none; width: 7mm; height: 7mm; border-radius: 50%; border: 1.2px solid #333; font-size: 10pt;
  display: inline-flex; align-items: center; justify-content: center; font-family: "BIZ UDPGothic", sans-serif;
}
.yj-wrow { display: flex; align-items: center; gap: 3mm; }
.yj-wrow .wline .mb { width: var(--mb, 15mm); height: var(--mb, 15mm); font-size: calc(var(--mb, 15mm) * 0.77); }
.yj-wrow .yj-arrow { font-size: calc(var(--mb, 15mm) * 0.9); line-height: 1; align-self: center; transform: translateY(-0.08em); }
.yj-wrow .wline.tr { min-width: calc(var(--mb, 15mm) * var(--len, 1)); }
.yj-wrow.stack { display: grid; grid-template-columns: auto 1fr; column-gap: 3mm; row-gap: 2mm; align-items: center; }
.yj-wrow.stack > .wline:last-child { grid-column: 2; }
.yj-arrow { font-size: 14pt; color: #777; flex: none; }
/* え を みて かこう */
.yj-rows.pics { display: grid; grid-template-columns: 1fr 1fr; align-content: space-evenly; gap: 2mm 8mm; }
.pic-item { position: relative; display: flex; flex-direction: column; align-items: center; gap: 2mm; }
.pic-item .yn { position: absolute; left: 0; top: 0; }
.pic-item .pic { width: var(--pic, 27mm); height: var(--pic, 27mm); object-fit: contain; }
.yj .pic-item .wline .mb { width: var(--mb, 14mm); height: var(--mb, 14mm); font-size: calc(var(--mb, 14mm) * 0.75); }
/* 3この ときは 1れつ。絵の よこに ますを おく */
.yj-rows.pics.one { grid-template-columns: 1fr; }
/* あなうめ:絵 → ことばの ます(1つ あな)→(○で えらぶ ときは こたえ 3つ)。カードは 下に きりとり線 */
.yj-rows.ana { display: flex; flex-direction: column; justify-content: space-evenly; gap: 1mm; }
.ana-item { display: flex; align-items: center; gap: 4mm; }
.ana-item .yn { position: static; flex: none; }
.ana-item .pic { width: var(--pic); height: var(--pic); object-fit: contain; flex: none; }
.yj .ana-item .wline .mb, .yj .ana-cards .acard { width: var(--mb); height: var(--mb); font-size: calc(var(--mb) * 0.75); }
.yj .ana-item .mb.blank { background: #fff; }
.ana-ch { display: flex; gap: 2.5mm; margin-inline-start: auto; flex: none; }
.ana-ch .c { width: var(--ch); height: var(--ch); border-radius: 50%; border: 1.2px solid #999; display: inline-flex; align-items: center; justify-content: center; font-size: calc(var(--ch) * 0.68); line-height: 1; }
.ana-ch .c.on { border: 2.4px solid #000; font-weight: bold; }
.ana-cards { margin-top: 3mm; border-top: 1.5px dashed #777; padding-top: 2mm; }
.ana-cards .cut { font-size: 3.6mm; color: #333; }
.ana-cards .cards { display: flex; flex-wrap: wrap; justify-content: center; gap: 4mm; margin-top: 2mm; }
.yj .ana-cards .acard { display: inline-flex; align-items: center; justify-content: center; border: 1.4px dashed #222; box-sizing: border-box; }
.yj .ana-cards .acard i { font-style: normal; line-height: 1; transform: translateY(-0.04em); }
.yj .ana-cards .acard { overflow: hidden; }
.yj-rows.pics.one .pic-item { flex-direction: row; justify-content: flex-start; gap: 8mm; padding-left: 6mm; }
/* しりとり */
.shiri { display: flex; gap: 3mm; align-items: flex-start; }
.shiri-line { display: flex; flex-wrap: wrap; align-items: center; gap: 3mm 2mm; }
.yj-shiri .wline .mb { width: 13mm; height: 13mm; font-size: 10mm; }
/* ことば さがし */
.yj-rows.search { justify-content: flex-start; align-items: center; gap: 8mm; padding-top: 4mm; }
.ygrid { border-collapse: collapse; }
.ygrid td {
  width: 20mm; height: 20mm; border: 1.4px solid #444; text-align: center; vertical-align: middle;
  font-size: 13mm; line-height: 1;
}
.ygrid td.hit { background: #d9d9d9; color: #000; font-weight: bold; }
/* クロスワード */
.yj-board { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly; gap: 6mm; }
.cw-grid { border-collapse: collapse; }
.cw-grid td { width: var(--c); height: var(--c); padding: 0; position: relative; text-align: center; vertical-align: middle; }
.cw-grid td.on { border: 1.6px solid #000; background: #fff; }
.cw-grid td i { position: absolute; left: 0.6mm; top: 0.2mm; font-style: normal; font-size: calc(var(--c) * 0.24); line-height: 1; }
.cw-grid td b { font-size: calc(var(--c) * 0.62); font-weight: normal; }
.cw-clues { display: flex; gap: 10mm; width: 100%; justify-content: center; }
.cw-col { display: flex; flex-wrap: wrap; gap: 3mm 5mm; align-content: flex-start; max-width: 50%; }
.cw-col p { flex-basis: 100%; margin: 0; font-weight: bold; font-size: 12pt; }
.cw-clue { display: inline-flex; align-items: center; gap: 1.5mm; }
.cw-clue b { display: inline-flex; align-items: center; justify-content: center; width: 6mm; height: 6mm; border: 1.2px solid #000; border-radius: 50%; font-size: 10pt; }
.cw-clue img { width: 22mm; height: 22mm; object-fit: contain; }
.cw-clue small { font-size: 9pt; letter-spacing: 0.08em; color: #444; }
/* しりとり めいろ */
.mz-wrap { position: relative; }
.mz-grid { border-collapse: separate; border-spacing: 7mm; position: relative; z-index: 1; }
.mz-grid td { width: 34mm; height: 34mm; border: 1.6px solid #000; border-radius: 4mm; background: #fff; text-align: center; vertical-align: middle; position: relative; padding: 1mm; }
.mz-grid .rd { position: absolute; display: block; border: 1.3px solid #000; background: #fff; }
.mz-grid .rd.r { left: 100%; top: calc(50% - 3mm); width: 7.4mm; height: 6mm; border-left: 0; border-right: 0; }
.mz-grid .rd.b { top: 100%; left: calc(50% - 3mm); height: 7.4mm; width: 6mm; border-top: 0; border-bottom: 0; }
.mz-grid td img { width: 23mm; height: 23mm; object-fit: contain; display: block; margin: 0 auto; }
.mz-grid td small { display: block; font-size: 10pt; }
.mz-tag { position: absolute; top: -3.4mm; left: 50%; transform: translateX(-50%); background: #000; color: #fff; font-size: 9pt; font-weight: bold; padding: 0.3mm 2mm; border-radius: 1.5mm; white-space: nowrap; }
.mz-line { position: absolute; left: 7mm; top: 7mm; width: calc(100% - 14mm); height: calc(100% - 14mm); pointer-events: none; z-index: 2; }
/* ことばの かいだん */
.kdw { align-items: stretch; }
.kd { display: flex; gap: 3mm; align-items: flex-start; }
.kd .yn { position: static; flex: none; }
.kd-steps { display: flex; flex-direction: column; gap: 2.5mm; }
.kd-row { display: flex; align-items: center; gap: 4mm; --mb: 19mm; }
.yj .kd-row .mb { width: var(--mb); height: var(--mb); font-size: calc(var(--mb) * 0.72); }
.kd-hint img { width: 19mm; height: 19mm; object-fit: contain; }
.kd + .kd { padding-top: 5mm; border-top: 1px dashed #999; }
.kd-hint small { font-size: 9pt; color: #555; }
.chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 3mm 5mm; max-width: 160mm; }
.chip { display: inline-flex; align-items: center; gap: 2mm; font-size: 17pt; border: 1.2px solid #444; border-radius: 99px; padding: 1mm 5mm 1.5mm 3mm; }
.chip .ck { width: 5mm; height: 5mm; border: 1.2px solid #444; border-radius: 50%; }
/* たりない 字 */
.yj-rows.two { display: grid; grid-template-columns: 1fr 1fr; align-content: space-evenly; gap: 6mm 6mm; }
.miss { display: flex; flex-direction: column; align-items: flex-start; gap: 2.5mm; }
.miss .yn { margin-bottom: -1mm; }
.opts { display: flex; gap: 4mm; padding-left: 2mm; }
.opt {
  width: 12mm; height: 12mm; border: 1.2px solid #777; border-radius: 50%; display: inline-flex;
  align-items: center; justify-content: center; font-size: 8.5mm; line-height: 1;
}
.opt.ans { border: 2.8px solid #000; color: #000; font-weight: bold; }
/* ならべかえ */
.sort { display: flex; align-items: center; gap: 3mm; }
.sort .hint { flex: none; width: 30mm; font-size: 10pt; border: 1px solid #999; border-radius: 2mm; padding: 1mm 2mm; text-align: center; font-family: "BIZ UDPGothic", sans-serif; }
.letters { display: flex; gap: 1.5mm; width: 50mm; }
.ball {
  width: 11mm; height: 11mm; border-radius: 50%; background: #fff; border: 1.2px solid #555;
  display: inline-flex; align-items: center; justify-content: center; font-size: 8mm; line-height: 1;
}
.sheet.yj .sheet-foot { padding-top: 1mm; }
/* ことばの きまり:A4 の 高さに あわせて、大問の 中で 問題を 均等に ならべる */
.sheet.km { height: var(--paper-h); }
.sheet.km .km-sec { display: flex; flex-direction: column; margin-top: 7mm; }
.sheet.km .km-sec > .instruction { margin-bottom: 2.5mm; }
.km-items { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; gap: 2mm; }
.km-items.c2 { display: grid; grid-template-columns: 1fr 1fr; align-content: space-evenly; column-gap: 8mm; }
.sheet.km .item { font-size: 12pt; line-height: 2.1; }
.sheet.km.g1 .item, .sheet.km.g2 .item { font-size: 13.5pt; letter-spacing: 0.03em; }
.sheet.km .item > .n { font-size: 10.5pt; }
.km-ch { white-space: nowrap; }
.km-ch i { font-style: normal; }
.km-ch .o { padding: 0 0.35em; border-radius: 999px; }
.sheet.answer .km-ch .o.ok { outline: 1.8px solid #000; outline-offset: -1px; }
.km-box { display: inline-block; width: 8mm; height: 8mm; border: 1.4px solid #000; vertical-align: middle; margin: 0 1.2mm;
  text-align: center; line-height: 7.6mm; font-weight: bold; }
.km-box.big { width: 9.5mm; height: 9.5mm; line-height: 9.1mm; flex: none; }
.km-u { text-decoration: underline; text-underline-offset: 5px; text-decoration-thickness: 1.5px; font-weight: bold; }
.km-br { display: block; height: 0; }
.km-lbl { font-size: 9.5pt; color: #333; margin-left: 5mm; }
.km-w u { text-align: center; }
/* 答えの ふりがなで 行が 高く ならないように(ふりがなは 上の すき間に はみ出させる) */
.sheet.km u .ans:has(ruby) { display: inline-block; margin-top: -0.75em; }
.km-bank, .km-legend { border: 1.4px solid #000; border-radius: 3px; padding: 2mm 5mm; margin: 0 0 2mm; }
.km-bank { display: flex; flex-wrap: wrap; justify-content: center; gap: 1mm 7mm; font-size: 12.5pt; }
.km-legend { display: grid; grid-template-columns: 1fr 1fr; gap: 1mm 6mm; font-size: 11pt; }
.km-legend.one { grid-template-columns: 1fr; gap: 0.5mm; }
.km-ch.long { display: flex; flex-direction: column; white-space: normal; margin-left: 4mm; line-height: 1.8; }
.km-ch.long .ln { display: flex; gap: 2mm; align-items: baseline; }
.km-ch.long .ln > i { font-size: 0.85em; flex: none; }
.km-ch.long .o { padding: 0 0.5em; }
.km-item.ord { align-items: flex-start; }
/* ローマ字: 4本線(上から アセンダー・x の 高さ・ベースライン・ディセンダー)。
   字は Andika(SIL OFL。a・g が 1階だての 学習用 書体)。11mm の とき ベースラインまで 1.2207em */
@font-face { font-family: "Andika"; font-weight: 400; src: url({{FONT:andika-latin.woff2}}) format("woff2"); }
.sheet.km.latin .item, .sheet.km.latin .km-ch { font-family: "Andika", "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic", "Meiryo", "Noto Sans JP", sans-serif; }
.km-4l {
  display: block; position: relative; height: 12.8mm; margin: 0.6mm 0; width: 100%;
  background:
    linear-gradient(#9a9a9a, #9a9a9a) 0 0.8mm / 100% 0.22mm no-repeat,
    repeating-linear-gradient(90deg, #9a9a9a 0 1.2mm, transparent 1.2mm 2.2mm) 0 3.8mm / 100% 0.22mm no-repeat,
    linear-gradient(#333, #333) 0 9.25mm / 100% 0.35mm no-repeat,
    linear-gradient(#9a9a9a, #9a9a9a) 0 12.0mm / 100% 0.22mm no-repeat;
}
.km-4l.il { display: inline-block; vertical-align: middle; margin: 0 1.5mm; }
.km-item.wls > .body { display: block; }
.km-item.wls .km-4l.il { display: block; margin: 0.5mm 0 0 2mm; max-width: 100%; }
.km-4l .tx { position: absolute; left: 2.5mm; top: calc(9.4mm - 11mm * 1.2207); font-family: "Andika", sans-serif;
  font-size: 11mm; line-height: 1.6113; white-space: nowrap; }
.km-4l .tx > span { margin-right: 6mm; }
.km-4l .m { color: #000; }
.km-4l .g { color: #b8b8b8; }
.km-4l .ans { font-weight: normal; color: #000; }
.km-item.trw > .body { display: flex; align-items: center; gap: 3mm; min-width: 0; white-space: nowrap; }
.km-item.trw > .body > .km-4l { flex: 1; width: auto; }
.km-ord { display: flex; flex-direction: column; gap: 1.5mm; }
.km-step { display: flex; align-items: center; gap: 3mm; line-height: 1.7; }
/* せんを なぞろう・せんで むすぼう・なまえ */
.yj-rows.lines { justify-content: space-evenly; gap: 2mm; }
.line-row { display: flex; align-items: center; gap: 1mm; }
.line-svg { width: 172mm; height: 38mm; flex: none; }
.yj-rows.unp { justify-content: space-evenly; }
/* かきかた(たて書き。右から) */
.kk-area { flex: 1; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; }
.kk-top { height: 4mm; }
.kk-band { display: flex; flex-direction: row-reverse; justify-content: center; }
.kk-grp { display: flex; flex-direction: row-reverse; }
/* お手本を 左に(右ききの 子が お手本を 見ながら 右へ なぞる) */
.kk-area.lt .kk-band, .kk-area.lt .kk-grp { flex-direction: row; }
.kk-rows { display: flex; flex-direction: column; }
.kk-row { display: flex; }
.kk-row .kk-c + .kk-c { margin-top: 0; margin-left: -1.4px; }
.kk-col { display: flex; flex-direction: column; }
.kk-c { position: relative; display: flex; align-items: center; justify-content: center; border: 1.4px solid #555; box-sizing: border-box;
  background: linear-gradient(#bbb, #bbb) center / 0 0 no-repeat; line-height: 1; }
.kk-c + .kk-c { margin-top: -1.4px; }
.kk-c::before, .kk-c::after { content: ""; position: absolute; border: 0 dashed #c8c8c8; }
.kk-c::before { left: 50%; top: 0; bottom: 0; border-left-width: 1px; }
.kk-c::after { top: 50%; left: 0; right: 0; border-top-width: 1px; }
.kk-c.bare { border-color: transparent; }
.kk-c.bare::before, .kk-c.bare::after { display: none; }
.kk-c .ks { position: absolute; inset: 3%; width: 94%; height: 94%; z-index: 1; overflow: visible; }
.kk-c i { position: relative; z-index: 1; font-style: normal; }
.kk-c i.g { color: #c4c4c4; }
.kk-c i.m { color: #111; }
/* あなうめ */
.an-area { flex: 1; display: flex; align-items: flex-start; justify-content: flex-start; margin-top: 6mm; }
.an-area.v { flex-direction: row-reverse; }
.an-area.h { flex-direction: column; }
.an-line { display: flex; position: relative; }
.an-area.v .an-line { flex-direction: column; }
.an-ch { display: flex; align-items: center; justify-content: center; line-height: 1; }
.an-area.v .an-ch i { writing-mode: vertical-rl; font-style: normal; }
.an-ch i { font-style: normal; }
.an-g { display: flex; position: relative; }
.an-area.v .an-g { flex-direction: column; }
.an-area.v .an-g .kk-c + .kk-c { margin-top: -1.4px; }
.an-area.h .an-g .kk-c + .kk-c { margin-top: 0; margin-left: -1.4px; }
.an-box { border-color: #222; }
.an-rt { position: absolute; display: flex; align-items: center; justify-content: center; line-height: 1.05; color: #111; letter-spacing: 0.05em; }
.an-area.v .an-rt { top: 0; bottom: 0; writing-mode: vertical-rl; }
.an-area.h .an-rt { left: 0; right: 0; }
.yj-kakikata .ans-mark { margin-left: 3mm; font-size: 11pt; border: 1.5px solid #111; border-radius: 1mm; padding: 0 2mm; }
.unp-row { display: flex; justify-content: center; }
.unp-svg { width: 180mm; flex: none; overflow: visible; }
.yj-rows.match { justify-content: center; align-items: center; }
.match-svg { width: 182mm; }
.match-svg .mt-n { font-size: 5px; font-family: "BIZ UDPGothic", sans-serif; }
.match-svg .mt-w { font-family: "KleeKana", "UD デジタル 教科書体 NK-R", "YuKyokasho", sans-serif; }
.yj-rows.names { justify-content: space-evenly; }
.nm-row { display: flex; align-items: center; gap: 3mm; }
.nm-lbl { width: 26mm; white-space: nowrap; font-size: 10pt; color: #444; flex: none; }
.yj .wline.nm .mb { width: var(--mb); height: var(--mb); font-size: calc(var(--mb) * 0.78); }
.yj .wline.nm .gap { display: inline-block; width: calc(var(--mb) * 0.45); }

@page { size: A4 portrait; margin: 0; }
/* A4 よこ: 紙の 大きさを 入れかえる。中身は 2だんに ながす(ようじは 1だんの まま)。入らない ときは ちぢめる(fitLand) */
body[data-orient="l"] { --paper-w: 297mm; --paper-h: 210mm; }
.sheet.land { height: var(--paper-h); overflow: hidden; --row-extra: 0mm !important; }
.sheet.land > .lbody { flex: 1; min-height: 0; overflow: hidden; }
.sheet.land.stv > .lbody { margin-top: 4mm; }
.sheet.land > .lbody.cols { column-count: 2; column-gap: 12mm; column-fill: auto; column-rule: 1px dashed #bbb; }
.sheet.land > .lbody.one { display: flex; flex-direction: column; }
.sheet.land .lbody.cols .item, .sheet.land .lbody.cols .q-item, .sheet.land .lbody.cols .km-item,
.sheet.land .lbody.cols .v, .sheet.land .lbody.cols h3, .sheet.land .lbody.cols .instruction { break-inside: avoid; }
.sheet.land .lbody.cols h3, .sheet.land .lbody.cols .instruction { break-after: avoid; }
.sheet.land .lbody.cols .q-group { margin-top: 3mm; }
.sheet.land .lbody.cols .items { grid-template-columns: 1fr; row-gap: 4mm; }
.sheet.land .lbody.cols .q-group:first-child { margin-top: 0; }
.sheet.land .st-zoom { transform: none !important; width: auto !important; margin-bottom: 0 !important; }
/* ようじの たて書き: 問題の ならびを まるごと たて書きに する(行は 右から、字は 上から) */
.sheet.yj.tate .yj-rows { writing-mode: vertical-rl; flex: 1; min-height: 0; }
/* 文章読解の たて書き(A4 よこ):見出しは よこの まま、中身を 右から 左へ */
.sheet.stv > .lbody.vt { writing-mode: vertical-rl; padding-left: 1.5mm; }
.sheet.stv .tcy { text-combine-upright: all; }
.sheet.stv .q-group { margin: 0; margin-block-start: 5mm; }
.sheet.stv .q-group:first-child { margin-block-start: 0; }
.sheet.stv .q-group > h3 { margin: 0; margin-block-end: 1.5mm; font-size: 10pt; }
.sheet.stv .q-group > h3 em { font-style: normal; }
.sheet.stv .reading-box { padding: 3mm 2.6mm; line-height: 1.85; }
.sheet.stv .q-read { margin: 0; margin-block-start: 3mm; gap: 1.6mm; }
.sheet.stv .q-read .q { align-items: baseline; }
.sheet.stv .q-read .q > span:not(.n):not(.paren) { flex: 0 1 auto; min-width: 0; }
.sheet.stv .q-read .q .n, .sheet.stv .vocab .v .n { min-width: 0; min-inline-size: 2.2em; }
.sheet.stv .q-read .q .paren { margin: 0; margin-inline-start: 2mm; min-width: 0; }
.sheet.stv .paren u { width: auto; min-width: 0; inline-size: 3.2em; block-size: 2em; border: 1px solid #888; border-radius: 1mm; text-align: center; }
.sheet.stv .q-read .choices { padding: 0; padding-inline-start: 2.2em; gap: 0.8mm 5mm; }
.sheet.stv .vocab { display: flex; flex-direction: column; gap: 2mm; margin: 0; margin-block-start: 1mm; }
.sheet.stv .vocab .v { align-items: flex-start; }
.sheet.stv .vocab .v .word { min-width: 0; min-inline-size: 5em; }
.sheet.stv .vocab .v .line { height: auto; width: auto; flex: 1; block-size: 7mm; border: 0; border-inline-start: 0; border-left: 1.2px solid var(--rule); }
.sheet.yj.tate .yj-rows .yn { writing-mode: horizontal-tb; }
.sheet.yj.tate .yj-row { flex-direction: column; align-items: flex-start; gap: 3mm; }
.sheet.yj.tate .yj-rows.ana { flex-direction: column; justify-content: space-evenly; align-items: flex-start; overflow: hidden; }
.sheet.yj.tate .ana-item { gap: 3mm; }
.sheet.yj.tate .ana-ch { gap: 1.5mm; writing-mode: horizontal-tb; margin-inline-start: 0; margin-block-start: 3mm; }
.sheet.yj.tate .yj-rows.pics { display: flex; flex-direction: column; justify-content: space-evenly; align-items: flex-start; gap: 4mm; }
.sheet.yj.tate .yj-rows.pics .pic-item { flex-direction: row; align-items: center; padding: 0; gap: 3mm; }
.sheet.yj.tate .pic-item .yn, .yj-rows.pics.one .pic-item .yn { position: static; flex: none; }
.sheet.yj.tate.land .yj-rows.pics .pic-item { flex-direction: row; padding: 0; gap: 3mm; }
.sheet.yj.tate .yj-wrow .wline.tr { min-width: 0; min-height: calc(var(--mb, 15mm) * var(--len, 1)); }
.sheet.yj.tate .yj-wrow.stack { column-gap: 2mm; row-gap: 3mm; }
/* よこの ようじ: 絵は 4れつ */
.sheet.land .yj-rows.pics { grid-template-columns: repeat(4, 1fr); }
.sheet.land .yj-rows.pics.one { grid-template-columns: repeat(3, 1fr); }
.sheet.land .yj-rows.pics.one .pic-item { flex-direction: column; padding-left: 0; gap: 3mm; }
@media print {
  body { background: #fff; }
  .panel, #home, .batch { display: none !important; }
  #sheets { padding: 0; }
  /* 1まい = 1ページ。スマホの 画面用の ちぢみ(transform)は 印刷では 使わない。
     はみ出しそうな ときは 印刷の 前に 中身を ちぢめる(fitForPrint)ので、ここでは 高さを きっちり 決めて あふれを かくす */
  .sheet { box-shadow: none; margin: 0 auto !important; transform: none !important;
    height: calc(var(--paper-h) - 0.4mm); min-height: 0; overflow: hidden; page-break-after: always; break-after: page; }
  .sheet:last-child { page-break-after: auto; break-after: auto; }
}
@media (max-width: 820px) {
  .sheet { transform-origin: top center; }
}
/* ===== ほかの教科のプリントへ(国語・算数・理科・社会 共通) ===== */
.xsite { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 12px; }
.xsite-lbl { font-size: 13px; font-weight: 700; color: #6b7280; margin-right: 2px; }
.xsite-a { display: inline-flex; align-items: center; min-height: 32px; padding: 3px 14px; border: 2px solid var(--xc); border-radius: 999px;
  background: #fff; color: var(--xc); font-size: 14px; font-weight: 700; line-height: 1.2; text-decoration: none; white-space: nowrap;
  transition: background-color .15s, color .15s, transform .15s; }
a.xsite-a:hover, a.xsite-a:focus-visible { background: var(--xc); color: #fff; transform: translateY(-1px); }
a.xsite-a:focus-visible { outline: 3px solid var(--xc); outline-offset: 2px; }
.xsite-a.on { background: var(--xc); color: #fff; cursor: default; }
@media (prefers-reduced-motion: reduce) { .xsite-a { transition: none; } a.xsite-a:hover { transform: none; } }
@media print { .xsite { display: none !important; } }
</style>

<script>
(() => {
  "use strict";

  {{DATA}}

  const BANKS = [words1, words2, words3, words4, words5, words6, words7];
  // 長文読解の 話(学年ごと)。無い 学年は 空。
  const READS = {};
  for (const [g, v] of [[1, typeof read1 !== "undefined" ? read1 : null],
                        [2, typeof read2 !== "undefined" ? read2 : null],
                        [3, typeof read3 !== "undefined" ? read3 : null],
                        [4, typeof read4 !== "undefined" ? read4 : null],
                        [5, typeof read5 !== "undefined" ? read5 : null],
                        [6, typeof read6 !== "undefined" ? read6 : null],
                        [7, typeof read7 !== "undefined" ? read7 : null]]) {
    if (v && v.length) READS[g] = v;
  }
  // 小6は 小5と 同じ 話(5・6年用に 書かれた もの)に、小6だけの 話(read6)を 足して 使う
  if (READS[5]) READS[6] = READS[5].concat(READS[6] || []);
  const hasLong = (g) => Boolean(READS[g] && READS[g].length);
  // ジャンル(物語・説明文・評論)。"all" は ぜんぶ
  const GENRES = [["all", "すべて"], ["story", "物語"], ["expo", "説明文"], ["essay", "評論"]];
  const storiesOf = (g, genre) => (READS[g] || []).filter((s) => !genre || genre === "all" || s.genre === genre);
  // その 学年に ある ジャンル(2つ いじょう あれば 「すべて」も)
  function genresOf(g) {
    const have = GENRES.filter(([k]) => k !== "all" && storiesOf(g, k).length);
    return have.length > 1 ? [GENRES[0]].concat(have) : have;
  }
  // えらべない ジャンルなら 「すべて」に もどす
  const genreFor = (g, genre) => (genre && genresOf(g).some(([k]) => k === genre) ? genre : "all");
  const KANJI = /[㐀-䶿一-鿿豈-﫿]/;

  /* ===== 乱数(シードで 同じものが 作れる) ===== */
  function makeRng(seed) {
    let a = (seed >>> 0) || 1;
    return function () {
      a += 0x6d2b79f5;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffled(list, rng) {
    const a = list.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ===== 語を 漢字の ぶぶんと おくりがなに 分ける ===== */
  function splitWord(w, r) {
    let i = w.length;
    while (i > 0 && !KANJI.test(w[i - 1])) i--;
    const tail = w.slice(i);
    const head = w.slice(0, i);
    let ruby = r;
    if (tail && r.endsWith(tail)) ruby = r.slice(0, r.length - tail.length);
    return { head, tail, ruby };
  }

  /* ===== 問題を えらぶ ===== */
  function pickEntries(bank, level, n, rng, used) {
    const order = level === 1 ? [1, 2, 3] : level === 3 ? [3, 2, 1] : [2, 1, 3];
    const out = [];
    for (const lv of order) {
      const pool = bank.filter((e) => e.lv === lv && !used.has(e.w));
      for (const e of shuffled(pool, rng)) {
        if (out.length >= n) break;
        out.push(e);
        used.add(e.w);
      }
      if (out.length >= n) break;
    }
    return out;
  }

  /* ===== プリント1枚ぶんの 中身を 作る ===== */
  // grade は 子どもの 学年(見出しの 字と ふりがなの 基準)。
  // gRead・gWrite・gStory は 読み・書き・長文の 学年(なければ grade と 同じ)。
  // exclude: 出さない 語(まとめて 何まいも 作る とき、まえの ページと かぶらないように)
  function buildSheet({ grade, kind, level, count, seed, no, nRead, nWrite, gRead, gWrite, gStory, furi, genre, tk, exclude, vmode, stdir }) {
    VM_OVERRIDE = ["choice", "none"].includes(vmode) ? vmode : "write";
    gRead = gRead || grade; gWrite = gWrite || grade; gStory = gStory || grade; furi = furi || "none";
    genre = genreFor(gStory, genre);
    const bankRead = BANKS[gRead - 1].entries;
    const bankWrite = BANKS[gWrite - 1].entries;
    const rng = makeRng(seed * 7919 + grade * 101 + level * 7 + (kind === "read" ? 1 : kind === "write" ? 2 : 3) +
                        (gRead - grade) * 1009 + (gWrite - grade) * 2003 + (gStory - grade) * 3001);
    const used = new Set(exclude || []);
    const groups = [];
    // 読み・書きの 問題数(指定が なければ 種類ごとの きまった 数)
    let nr, nw;
    if (typeof nRead === "number" || typeof nWrite === "number") {
      nr = nRead || 0;
      nw = nWrite || 0;
    } else if (kind === "both") {
      nr = Math.max(2, Math.round(count / 2));
      nw = count - nr;
    } else if (kind === "long") {
      nr = 4; nw = 8;
    } else {
      nr = kind === "read" ? count : 0;
      nw = kind === "write" ? count : 0;
    }
    if (nr) groups.push({ type: "read", entries: pickEntries(bankRead, level, nr, rng, used) });
    if (nw) groups.push({ type: "write", entries: pickEntries(bankWrite, level, nw, rng, used) });
    let n = 0;
    for (const g of groups) {
      g.items = g.entries.map((e) => {
        n += 1;
        return Object.assign({ no: n }, e, splitWord(e.w, e.r));
      });
    }
    const sheet = { grade, gRead, gWrite, gStory, furi, genre, kind, level, count, seed, no, groups,
                    tk: !!tk && kind !== "long", label: BANKS[grade - 1].label };
    if (kind === "long" && hasLong(gStory)) {
      // えらんだ 漢字の 数と いっしょに 1枚に 入る 話だけから えらぶ
      const L = layoutOf("long", gStory, furi, genre);
      const kanji = estHeight("long", nr, nw, gStory, furi, genre) - L.base;
      const H = tbl(furi === "none" ? "storyH" : "storyHR");
      // ふりがな すべての ときは 見つもりより 少し 高く なる ことが あるので 1.5mm よゆうを みる
      const fitsStory = (st) => (H[st.id] || L.base) + kanji + (furi === "all" ? 1.5 : 0) <= L.limit;
      const pool = storiesOf(gStory, genre);
      const ok = pool.filter(fitsStory);
      const list = ok.length ? ok : pool;
      const story = list[(seed - 1) % list.length];
      sheet.storyH = H[story.id] || L.base;
      sheet.story = {
        id: story.id,
        genre: story.genre,
        passage: story.passage,
        vocab: story.vocab,
        questions: story.questions.map((q) => {
          // 選択肢を シードで 並べかえて、正解の かたよりを なくす
          const order = shuffled([0, 1, 2].slice(0, q.c.length), rng);
          return { q: q.q, c: order.map((i) => q.c[i]), a: order.indexOf(q.a) };
        })
      };
      // 語句の 問題: えらぶ(3つの 意味から)か 書く(調べて 書く)
      sheet.vmode = ["choice", "none"].includes(vmode) ? vmode : "write";
      sheet.story.vq = vocabQ(story.vocab, gStory, rng, false);
      // 文章だけの ときは たて書き(A4 よこ)にも できる
      sheet.tate = stdir === "v" && !nr && !nw;
    }
    VM_OVERRIDE = null;
    return sheet;
  }

  /* ===== 語句の 意味を えらぶ 問題 =====
     正しい 意味(src/data/vocab_mean.tsv)と、同じ 学年の ほかの 語の 意味 2つを ならべる。
     まちがいの 意味は、なるべく 同じ なかま(動きの 言葉・ようすの 言葉・ものの 名前)から えらぶ。 */
  const VM = typeof vocabMean !== "undefined" ? vocabMean : {};
  function vClass(m) {
    if (/(ようす|こと|もの|ところ|とき|人|気持ち)$/.test(m)) return "n";
    if (/い$/.test(m)) return "a";
    if (/[うくぐすつぬぶむる]$/.test(m)) return "v";
    return "n";
  }
  const VPOOL = {};
  function vocabPoolOf(g) {
    if (!VPOOL[g]) {
      const set = new Set();
      for (const st of READS[g] || []) for (const w of st.vocab || []) if (VM[w]) set.add(VM[w]);
      VPOOL[g] = [...set];
    }
    return VPOOL[g];
  }
  // worst: 高さを はかる ときに、いちばん 長い 意味を まちがいに して 組む
  function vocabQ(vocab, g, rng, worst) {
    if (!vocab || !vocab.length || vocab.some((w) => !VM[w])) return null;
    const pool = vocabPoolOf(g), own = new Set(vocab.map((w) => VM[w]));
    return vocab.map((w) => {
      const m = VM[w], cls = vClass(m);
      let cand = pool.filter((x) => !own.has(x) && vClass(x) === cls);
      if (cand.length < 2) cand = pool.filter((x) => !own.has(x));
      const picks = worst ? cand.slice().sort((a, b) => b.length - a.length).slice(0, 2) : shuffled(cand, rng).slice(0, 2);
      const opts = [m].concat(picks);
      const order = worst ? [1, 2, 0] : shuffled([0, 1, 2], rng);
      return { w, c: order.map((i) => opts[i]), a: order.indexOf(0) };
    });
  }

  /* ===== 1枚に 入るかの 見つもり =====
     実測した 高さ(mm)。読みは 1行(2問)で 約17mm、
     書きは ますが あるので 約26mm。この 差を もとに、読みと 書きの 数の
     くみあわせが A4 1枚に 入るかを 決める。 */
  // 長文の プリントは、本文の 長さが 学年で ちがうので、土台(漢字の 問題 なし)の 高さを
  // 学年ごとに 実測して 使う(tools/measure_layout.js が src/data/layout.json に 書く)
  // ふりがなを つけると 行が 高く なるので、ふりがな あり(すべての 漢字)の 高さも 別に 測って ある
  const LD = typeof layoutData !== "undefined" ? layoutData : {};
  // 語句を「えらぶ」に すると 高く なるので、その 高さも 別に 測って ある(〜C)。
  // buildSheet の 中では その プリントの vmode、それ いがいは 画面の せってい(state.vmode)で えらぶ
  let VM_OVERRIDE = null;
  const tbl = (k) => {
    const vm = VM_OVERRIDE || (typeof state !== "undefined" ? state.vmode : "write");
    return (vm === "choice" && LD[k + "C"]) || LD[k] || {};
  };
  const LAYOUT = {
    normal: { base: 48.5, group: 22.5, read: 16.8, write: 25.9, limit: 292, cap: 12, top: 30 },
    long:   { base: 193, group: 16.7, read: 6.9, write: 19.0, limit: 294.5, cap: 2.5, top: 12 },
    // 大きい 字(特別支援学校むけ)。1れつに 1問ずつ
    tk:     { base: 48.5, group: 28, read: 16.6, write: 26.4, limit: 292, cap: 10, top: 12, cols: 1 }
  };
  const DEFAULTS = { both: [8, 8], read: [16, 0], write: [0, 12], long: [4, 8] };
  const TK_DEFAULTS = { both: [4, 4], read: [8, 0], write: [0, 6] };
  // 大きい 字の ときは レイアウトの 種類を "tk" に して 見つもる
  const layoutKind = (kind, tk) => (tk && kind !== "long" ? "tk" : kind);
  // grade は 長文の 学年。furi は ふりがな("none" / "over" / "all")。genre は ジャンル(なければ すべて)
  // 土台は「学年:ジャンル」ごとにも 測って あるので、ジャンルを しぼると その ジャンルの 話の 長さで 見つもる
  function layoutOf(kind, grade, furi, genre) {
    if (kind === "tk") return LAYOUT.tk;
    if (kind !== "long") return LAYOUT.normal;
    const table = tbl(furi && furi !== "none" ? "longBaseR" : "longBase");
    const key = genre && genre !== "all" ? `${grade}:${genre}` : null;
    const base = (key && table[key]) || table[grade] || tbl("longBase")[grade] || LAYOUT.long.base;
    return Object.assign({}, LAYOUT.long, { base });
  }
  const rowsOf = (n) => Math.ceil(n / 2);
  function estHeight(kind, nr, nw, grade, furi, genre) {
    const L = layoutOf(kind, grade, furi, genre);
    let h = L.base;
    const rows = (n) => Math.ceil(n / (L.cols || 2));
    if (nr) h += L.group + L.read * rows(nr);
    if (nw) h += L.group + L.write * rows(nw);
    return h;
  }
  const fits = (kind, nr, nw, grade, furi, genre) =>
    estHeight(kind, nr, nw, grade, furi, genre) <= layoutOf(kind, grade, furi, genre).limit;
  // もう一方を other 問に したとき、which("read" か "write")は 何問まで 入るか
  function maxFor(kind, which, other, grade, furi, genre) {
    let best = 0;
    for (let n = 2; n <= layoutOf(kind, grade, furi, genre).top; n += 2) {
      if (which === "read" ? fits(kind, n, other, grade, furi, genre) : fits(kind, other, n, grade, furi, genre)) best = n;
    }
    return best;
  }
  // 種類を えらんだ ときの 数。長文は 学年ごとに 入る 中で いちばん 多い くみあわせ
  function defaultCounts(kind, grade, furi, genre) {
    if (kind !== "long") return DEFAULTS[kind].slice();
    for (const c of [[4, 8], [4, 6], [4, 4], [2, 4], [2, 2], [2, 0], [0, 0]]) {
      if (fits(kind, c[0], c[1], grade, furi, genre)) return c;
    }
    return [0, 0];
  }

  /* ===== ふりがな =====
     src/data/ruby.json(tools/furigana.py が 作る)に「もとの 文 → {漢字|かんじ} つきの 文」が ある。
     "over" は、子どもの 学年までに 習わない 漢字が 1字でも ある ところに だけ つける。 */
  const RUBY = typeof rubyData !== "undefined" ? rubyData : {};
  const KGRADE = {};
  if (typeof kanjiGrades !== "undefined") {
    for (const g of Object.keys(kanjiGrades)) for (const c of kanjiGrades[g]) KGRADE[c] = Number(g);
  }
  const KANJI_ALL = /[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff]/;
  function learned(word, grade) {
    for (const c of word) if (KANJI_ALL.test(c) && (KGRADE[c] || 7) > grade) return false;
    return true;
  }
  function rubyHtml(text, furi, grade) {
    const m = furi && furi !== "none" ? RUBY[text] : null;
    if (!m) return esc(text);
    return m.split(/(\{[^|}]+\|[^}]+\})/).map((part) => {
      const r = /^\{([^|}]+)\|([^}]+)\}$/.exec(part);
      if (!r) return esc(part);
      if (furi === "over" && learned(r[1], grade)) return esc(r[1]);
      return `<ruby>${esc(r[1])}<rt>${esc(r[2])}</rt></ruby>`;
    }).join("");
  }

  // 学年に 合わせた 見出し。小1・小2 は その 学年までに 習う 字だけで 書く
  function labelsFor(grade) {
    const std = {
      title: "国語 プリント", date: "日付", name: "名前",
      readTitle: "漢字の 読みがなを 書きましょう",
      readInst: "――（下線の 漢字）の 読みがなを （　）に 書きましょう。",
      writeTitle: "漢字を 書きましょう",
      writeInst: "かこみの 読み方に なるように、ますに 漢字を 書きましょう。",
      story: "次の 文章を 読んで、後の 問いに 答えましょう",
      vocab: "次の 言葉の 意味を 調べて 書きましょう",
      vocabC: "次の 言葉の 意味に 合う ものを えらびましょう"
    };
    if (grade === 1) return Object.assign(std, {
      title: "こくご プリント", date: "ひづけ", name: "なまえ",
      readTitle: "かんじの よみかたを かきましょう",
      readInst: "――（せんの かんじ）の よみかたを （　）に かきましょう。",
      writeTitle: "かんじを かきましょう",
      writeInst: "上の よみかたに なるように、ますに かんじを かきましょう。",
      story: "つぎの ぶんしょうを よんで、もんだいに こたえましょう",
      vocab: "つぎの ことばの いみを しらべて かきましょう",
      vocabC: "つぎの ことばの いみに あう ものを えらびましょう"
    });
    if (grade === 2) return Object.assign(std, {
      date: "日づけ",
      readTitle: "かん字の 読みがなを 書きましょう",
      readInst: "――（線の かん字）の 読みがなを （　）に 書きましょう。",
      writeTitle: "かん字を 書きましょう",
      writeInst: "上の 読み方に なるように、ますに かん字を 書きましょう。",
      story: "つぎの 文しょうを 読んで、もんだいに 答えましょう",
      vocab: "つぎの ことばの いみを しらべて 書きましょう",
      vocabC: "つぎの ことばの いみに あう ものを えらびましょう"
    });
    if (grade === 3) return Object.assign(std, {
      date: "日づけ",
      vocab: "次の 言葉の 意味を 調べて 書きましょう"
    });
    return std;
  }

  // 計測用: 漢字の 問題 なしで、きまった 話の 長文プリントを 作る
  function longSheetFor(grade, story, furi) {
    const s = buildSheet({ grade, kind: "long", level: 2, seed: 1, no: 1, nRead: 0, nWrite: 0, furi: furi || "none" });
    s.story = { passage: story.passage, vocab: story.vocab,
                questions: story.questions.map((q) => ({ q: q.q, c: q.c, a: q.a })),
                vq: vocabQ(story.vocab, grade, null, true) };
    s.vmode = "choice";
    s.storyH = 0;
    return s;
  }

  /* ===== 組み立て ===== */
  function esc(s) {
    return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  }

  function itemHtml(item, type, opt, long) {
    const n = `<span class="n">(${item.no})</span>`;
    if (type === "read") {
      const sentence = esc(item.s).replace("{}", `<span class="target">${esc(item.w)}</span>`);
      // 答えの 読みが 長いときは 字を 小さく して、問題の ページと 同じ はばに おさめる
      const fit = item.r.length > 4 ? ` style="font-size:${(4.4 / item.r.length).toFixed(2)}em"` : "";
      const inside = opt.answer ? `<span class="ans"${fit}>${esc(item.r)}</span>` : "&nbsp;";
      const model = !opt.answer && opt.model && item.no === 1
        ? `<span class="model">${esc(item.r)}</span>` : inside;
      return `<div class="item r">${n}<span class="body"><span class="s">${sentence}</span>` +
        `<span class="paren">（<u>${model}</u>）</span></span></div>`;
    }
    const cells = [...item.head].map((ch) => {
      let inner = "";
      if (opt.answer) inner = `<span class="ans">${esc(ch)}</span>`;
      else if (opt.model && item.no === 1) inner = `<span class="ans model">${esc(ch)}</span>`;
      return `<span class="cell">${inner}</span>`;
    }).join("");
    const box = `<span class="wbox${item.head.length > 3 ? " small" : item.head.length === 3 ? " mid" : ""}">` +
      `<span class="ruby">${esc(item.ruby)}</span><span class="cells">${cells}</span></span>`;
    const sentence = esc(item.s).replace("{}", box + esc(item.tail));
    return `<div class="item">${n}<span class="body">${sentence}</span></div>`;
  }

  const MARK = ["ア", "イ", "ウ", "エ"];

  function storyHtml(story, n, opt, lab, furi, grade, vmode, tate) {
    const R = (s) => rubyHtml(s, furi, grade);
    // たて書きの 番号は 数字を たてに 1つに まとめる
    const N = (k) => tate ? `（<span class="tcy">${k}</span>）` : `(${k})`;
    const qs = story.questions.map((q, i) => {
      const choices = q.c.map((c, j) =>
        `<span class="choice"><span class="mark">${MARK[j]}</span><span>${R(c)}</span></span>`).join("");
      const inside = opt.answer ? `<span class="ans">${MARK[q.a]}</span>` : "&nbsp;";
      return `<div class="q-item"><div class="q"><span class="n">${N(i + 1)}</span>` +
        `<span>${R(q.q)}</span><span class="paren">（<u>${inside}</u>）</span></div>` +
        `<div class="choices">${choices}</div></div>`;
    }).join("");
    // 語句: えらぶ(3つの 意味から 記号で)か、書く(こたえの ページには 意味の れいを 出す)
    const choose = vmode === "choice" && story.vq;
    const vocab = choose
      ? story.vq.map((v, i) => {
        const choices = v.c.map((c, j) =>
          `<span class="choice"><span class="mark">${MARK[j]}</span><span>${R(c)}</span></span>`).join("");
        const inside = opt.answer ? `<span class="ans">${MARK[v.a]}</span>` : "&nbsp;";
        return `<div class="q-item vq"><div class="q"><span class="n">${N(i + 1)}</span>` +
          `<span class="word">${R(v.w)}</span><span class="paren">（<u>${inside}</u>）</span></div>` +
          `<div class="choices">${choices}</div></div>`;
      }).join("")
      : story.vocab.map((w, i) =>
        `<div class="v"><span class="n">${N(i + 1)}</span><span class="word">${R(w)}</span>` +
        `<span class="line">${opt.answer && VM[w] ? `<span class="ans vm">（れい）${R(VM[w])}</span>` : ""}</span></div>`).join("");
    const E = (k) => tate ? `<em><span class="tcy">${k}</span></em>` : `<em>${k}</em>`;
    return `<section class="q-group"><h3>${E(n)}${lab.story}</h3>` +
      `<div class="reading-box">${R(story.passage)}</div>` +
      `<div class="q-read">${qs}</div></section>` +
      (story.vocab.length && vmode !== "none"
        ? `<section class="q-group"><h3>${E(n + 1)}${choose ? lab.vocabC : lab.vocab}</h3>` +
          (choose ? `<div class="q-read vq-list">${vocab}</div>` : `<div class="vocab">${vocab}</div>`) + `</section>`
        : "");
  }

  function sheetHtml(sheet, opt) {
    opt = opt || {};
    const lab = labelsFor(sheet.grade);
    const groups = sheet.groups.map((g, i) => {
      const items = g.items.map((it) => itemHtml(it, g.type, opt, sheet.kind === "long")).join("");
      return `<section class="q-group">` +
        `<h3><em>${i + 1}</em>${g.type === "read" ? lab.readTitle : lab.writeTitle}</h3>` +
        `<p class="instruction">${g.type === "read" ? lab.readInst : lab.writeInst}</p>` +
        `<div class="items">${items}</div></section>`;
    }).join("");
    const furi = sheet.furi || "none";
    const story = sheet.story ? storyHtml(sheet.story, sheet.groups.length + 1, opt, lab, furi, sheet.grade, sheet.vmode, sheet.tate) : "";
    // 問題が 少ないときは、あまった 高さを 行の あいだと 大問の あいだに 同じだけ くばる
    const nr = sheet.groups.filter((g) => g.type === "read").reduce((s, g) => s + g.items.length, 0);
    const nw = sheet.groups.filter((g) => g.type === "write").reduce((s, g) => s + g.items.length, 0);
    const lk = layoutKind(sheet.kind, sheet.tk);
    const gs = sheet.gStory || sheet.grade;
    const L = layoutOf(lk, gs, furi, sheet.genre);
    let slots = sheet.groups.reduce((s, g) => s + Math.ceil(g.items.length / (L.cols || 2)), 0);
    if (sheet.story) slots += sheet.story.vocab.length ? 2 : 1;
    let used = estHeight(lk, nr, nw, gs, furi, sheet.genre);
    if (sheet.kind === "long" && sheet.storyH) used += sheet.storyH - L.base;
    if (sheet.kind === "long" && furi === "all") used += 1.5;
    // 文章だけ(漢字なし)の ときは、あまった 高さを 字を 大きく する ことに つかう(fixZoom が 1枚に 入る 大きさを きめる)
    const storyOnly = sheet.kind === "long" && sheet.story && !sheet.groups.length;
    const tate = storyOnly && sheet.tate;
    const extra = storyOnly ? 0 : slots ? Math.max(0, Math.min(L.cap, (L.limit - used) / slots)) : 0;
    return `<div class="sheet g${gs}${opt.answer ? " answer" : ""}${sheet.kind === "long" ? " long" : ""}${sheet.tk ? " tk" : ""}` +
      `${sheet.story && furi !== "none" ? " furi" : ""}${tate ? " tate stv" : ""}"` +
      ` style="--row-extra:${extra.toFixed(2)}mm">` +
      `<div class="sheet-head"><span class="label">${lab.title}</span>` +
      `<span class="no">${sheet.no}</span>` +
      `<span class="fields">` +
      `<span class="field"><i>${lab.date}</i><b></b></span>` +
      `<span class="field name"><i>${lab.name}</i><b></b></span></span></div>` +
      groups + (storyOnly && !tate ? `<div class="st-zoom">${story}</div>` : story) +
      (opt.answer && opt.list ? ansListHtml(sheet) : "") +
      `<div class="sheet-foot"><span class="seed">シード ${sheet.seed}</span></div></div>`;
  }

  function ansListHtml(sheet) {
    const all = sheet.groups.flatMap((g) =>
      g.items.map((it) => `<li>${esc(g.type === "read" ? it.r : it.w)}</li>`));
    if (sheet.story) all.push(...sheet.story.questions.map((q) => `<li>${MARK[q.a]}</li>`));
    return `<section class="ans-list"><h3>答え</h3><ol>${all.join("")}</ol></section>`;
  }

  /* ===== ことばの きまり =====
     学習指導要領 〔知識及び技能〕(助詞・主語と述語・カタカナ など)の プリント。
     データは src/data/kimari.txt(tools/kimari.py が 読む)。1まい = 1つの 内容。 */
  const KM = typeof kimariData !== "undefined" ? kimariData : [];
  // 学年の 単元(教科書の じゅん。kimari.txt の % 行)
  const kimariTopics = (g) => KM.filter((t) => t.grades.includes(g))
    .sort((a, b) => ((a.ord || {})[g] ?? 999) - ((b.ord || {})[g] ?? 999));
  const hasKimari = (g) => kimariTopics(g).length > 0;
  // ktopic が "auto" なら シードで じゅんばんに かわる
  function kimariTopicFor(g, ktopic, seed) {
    const list = kimariTopics(g);
    if (!list.length) return null;
    return list.find((t) => t.id === ktopic) || list[(seed - 1) % list.length];
  }
  const kmLen = (s) => [...String(s).replace(/｜([^《]+)《[^》]+》/g, "$1")].length;
  // ローマ字で 小文字・大文字を えらべる 単元(①②③⑩は 大文字・小文字 そのものを 学ぶので のぞく)
  const RCASE_SKIP = ["romaji01", "romaji02", "romaji03", "romaji10"];
  const hasRcase = (id) => !!id && id.startsWith("romaji") && !RCASE_SKIP.includes(id);
  // ローマ字の 書き方: std = 教科書(ten'in・okâsan)/ hyp = のばす 音は ハイフン・ん の 区切りは すきま(oka-san・ten in)/ sep = 1音ずつ(te n i n)
  // データの «教科書¦ハイフン¦1音ずつ» から えらぶ(tools/make_romaji.py が 作る)
  const RSTYLES = ["std", "hyp", "sep"];
  const hasRstyle = (id) => /^romaji(0[4-9]|1[0-2])$/.test(id || "");
  function buildKimariSheet({ grade, ktopic, seed, no, rcase, kfuri, klearn, rstyle }) {
    const t = kimariTopicFor(grade, ktopic, seed);
    const si = Math.max(0, RSTYLES.indexOf(rstyle));
    const SEL = (x) => (typeof x === "string" && x.includes("«") ? x.replace(/«([^¦»]*)¦([^¦»]*)¦([^»]*)»/g, (m, a, b, c) => [a, b, c][si]) : x);

    const UP = (x) => (upper ? x.replace(/[a-zâêîôû]/g, (c) => c.toUpperCase()) : x);
    const rng = makeRng(seed * 7919 + 101);
    let num = 0;
    // 前の 大問の 答えが わかって しまう 問題(同じ ことわざの 穴うめと 意味 など)は 出さない
    const keyOf = (it) => {
      if (it.order) return "";
      const k = it.find((p) => p[0] === "k");
      if (k) return "#" + k[1];
      const br = it.findIndex((p) => p[0] === "br");
      return (br < 0 ? it : it.slice(0, br)).map((p) => (p[0] === "t" || p[0] === "u" || p[0] === "w" || p[0] === "wl" ? p[1] : p[0] === "c" ? p[1][p[2]] : p[0] === "tr" ? p[1].join(" ") : "")).join("").replace(/[\s　。、]/g, "");
    };

    const sections = t.sections.map((sec0) => {
      const sec = Object.assign({}, sec0, { items: sec0.items.map(styleItem) });
      // （　）の はばは、その 大問で いちばん 長い 答えに そろえる(答えの 長さが わからないように)
      let longest = 0, longestL = 0;
      for (const it of sec.items) if (!it.order) for (const p of it) {
        if (p[0] === "w") longest = Math.max(longest, kmLen(p[1]));
        if (p[0] === "wl") longestL = Math.max(longestL, kmLen(p[1]));
      }
      const pool = sec.items.filter((it) => !used.has(keyOf(it)));
      // seq: 前から じゅんばんに(シード 1 → 1〜n こめ、シード 2 → その つぎ …)

        ? Array.from({ length: Math.min(sec.n, sec.items.length) }, (_, k) => sec.items[((seed - 1) * sec.n + k) % sec.items.length])

        if (it.order) {

          if (p[0] !== "c" || sec.fixed) return p;

          return ["c", idx.map((i) => p[1][i]), idx.indexOf(p[2])];
        }).map((p) => {
          if (!upper) return p;
          if (p[0] === "t" || p[0] === "u" || p[0] === "wl") return [p[0], UP(p[1])];
          if (p[0] === "w") return ["w", UP(p[1]), p[2]];
          if (p[0] === "c") return ["c", p[1].map(UP), p[2]];
          if (p[0] === "tr") return ["tr", p[1].map(UP)];

        });
        return { no: ++num, parts };
      });
      // 4本線の はばは この プリントに 出た 答えで きめる(2れつの ときは 列の はばまで)
      longestL = 0;

      return Object.assign({}, sec, { items, bank, wmm: sec.w || Math.max(16, longest * 5.8 + 6),

    // 習った 漢字: prev = 前の 学年まで(年度の はじめ)、this = その 学年まで。中学は 小6までの 漢字
    const kbase = grade >= 7 ? 6 : klearn === "this" ? grade : grade - 1;
    return { km: true, grade, topic: t.id, name: t.name, seed, no, sections, latin: t.id.startsWith("romaji"),

  const rb = (s) => esc(s).replace(/｜([^《]+)《([^》]+)》/g, "<ruby>$1<rt>$2</rt></ruby>");

        x.startsWith("!") ? `<span class="m">${esc(x.slice(1))}</span>` : `<span class="g">${esc(x)}</span>`).join("")}</span></span>`;

        (sec.legend ? `<div class="km-legend${Math.max(...sec.legend.map(kmLenP)) > 15 ? " one" : ""}">${sec.legend.map((l) => `<span>${KR(l)}</span>`).join("")}</div>` : "") +

      `<div class="sheet-head"><span class="label">${lab.title}</span><span class="no">${s.no}</span>` +
      `<span class="fields"><span class="field"><i>${lab.date}</i><b></b></span>` +

  /* ===== ようじ(幼児)の プリント =====

                  ["line", "せんを なぞろう"], ["unpitsu", "うんぴつ(線の れんしゅう)"], ["kakikata", "かきかた(じゆうに 書く)"], ["match", "せんで むすぼう"], ["name", "なまえを かこう"], ["ana", "あなうめ(絵を みて 字を いれる)"]];

  const YPICS = typeof youjiPics !== "undefined" ? youjiPics : {};
  const YHINTS = [["first", "さいしょの 字を なぞる"], ["all", "ぜんぶ なぞる(うすい字)"], ["none", "ヒント なし"]];
  // え を みて かこう の テーマ(その 字の しゅるいに ある ものだけ 出す)
  const picCats = (script) => [...new Set(((YD.pics || {})[script] || []).map((x) => x.cat))];
  const YPLAYS = [["mix", "じゅんばんに(シードで かわる)"], ["shiri", "しりとり"], ["search", "ことば さがし"],
                  ["miss", "たりない 字"], ["sort", "ならべかえ"], ["cross", "クロスワード(絵が ヒント)"], ["maze", "しりとり めいろ"], ["kaidan", "ことばの かいだん"]];
  const YTITLE = { hira: "ひらがな れんしゅう", kata: "カタカナ れんしゅう", word: "ことば れんしゅう", pic: "え と ことば", play: "ことば あそび",
                   line: "せんの れんしゅう", unpitsu: "うんぴつ れんしゅう", kakikata: "かきかた れんしゅう", match: "むすんで みよう", name: "なまえの れんしゅう", ana: "あなうめ" };
  // ===== せんを なぞろう(うんぴつ)。かたちは viewBox 180×40(mm)の なかの パス =====
  const LX0 = 34, LX1 = 146, LY = 20;
  function waveD(amp, n) {
    const w = (LX1 - LX0) / n;
    let d = `M${LX0},${LY}`;
    for (let i = 0; i < n; i++) d += ` Q${LX0 + w * (i + 0.5)},${LY + (i % 2 ? amp : -amp) * 2} ${LX0 + w * (i + 1)},${LY}`;
    return d;
  }

    const w = (LX1 - LX0) / n;
    let d = `M${LX0},${LY + amp}`;
    for (let i = 1; i <= n; i++) d += ` L${LX0 + w * i},${LY + (i % 2 ? -amp : amp)}`;

  const LINE_SHAPES = {
    1: [() => `M${LX0},${LY} L${LX1},${LY}`, () => `M${LX0},${LY + 8} Q${(LX0 + LX1) / 2},${LY - 24} ${LX1},${LY + 8}`,

  const uarch = (k, up) => (cy, A) => usample((t) => [UX0 + (UX1 - UX0) * t, cy + (up ? 1 : -1) * (A - 2 * A * Math.abs(Math.sin(Math.PI * k * t)))], 60 * k);
  const ucurve = (up) => (cy, A) => usample((t) => [UX0 + (UX1 - UX0) * t, cy + (up ? 1 : -1) * (A * 0.8 - 1.6 * A * Math.sin(Math.PI * t))], 80);

  // 点の ならびの 長さと、とちゅうの 位置・むき
  function uMeasure(pts) {
    const L = [0];
